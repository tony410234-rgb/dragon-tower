<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2a1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>용의 탑</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 동화책 같은 판타지 모험, 한 판 15~25분
   IDEA: 횃불 켜진 탑을 한 층씩 오르는 원정 일지와 카드 테이블
   PICTURE: 돌바닥 위에서 마주 선 용사와 괴물들, 갈림길 지도
   COLOUR+TYPE: 깊은 와인빛 돌벽, 양피지 카드, 청록 마나, 붉은 체력 / Black Han Sans + Noto Sans KR
   LAYOUT: 상단 상태바, 가운데 전장, 하단 손패 — 폰 세로 화면 전용 */
:root{color-scheme:dark;--wall:#4a2230;--deep:#1c0d15;--parch:#f5ecd9;--ink:#24151b;--hp:#e5452f;--gold:#f0c04a;--mana:#3fd1c4;--atk:#c93a2a;--mag:#2a8fd8;--def:#5b7a8c;--skl:#3f9a5a;--soft:#e8c9b0}
*{box-sizing:border-box;min-width:0}
html,body{min-height:100%;overscroll-behavior:none}
body{margin:0;background:radial-gradient(130% 70% at 50% 0,#6a2f40,var(--wall) 45%,var(--deep));background-attachment:fixed;color:var(--parch);font:15px/1.45 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3{font-family:"Black Han Sans",sans-serif;font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(40px,12vw,60px)}h2{font-size:30px}h3{font-size:22px}
p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;min-height:44px;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{background:var(--hp);color:#fff;border-radius:12px;padding:10px 20px;font-weight:900;box-shadow:0 4px 0 #8f2416}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f2416}
.btn.alt{background:var(--parch);color:var(--ink);box-shadow:0 4px 0 #b4a688}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--parch);box-shadow:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.soft{color:var(--soft)}
.bar{display:flex;align-items:center;gap:8px 12px;padding:8px 12px;background:rgba(20,8,13,.7);font-weight:700;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.hp{flex:1 1 130px;height:18px;background:#3d1512;border-radius:9px;overflow:hidden;position:relative}
.hp i{display:block;height:100%;background:linear-gradient(#ff7c62,#c93a2a);transition:width .3s}
.hp span{position:absolute;inset:0;text-align:center;font-size:13px;line-height:18px;text-shadow:0 1px 2px #000}
.gold{color:var(--gold)}.chip{white-space:nowrap;font-size:14px}
.bar .btn{min-height:36px;padding:4px 10px;font-size:14px}
.ico{width:36px;min-height:36px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.1)}
.ico svg{width:20px;height:20px}
.rels{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap}
.rel{width:30px;min-height:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,transparent 45%),var(--rc);color:#fff;font-weight:900;font-size:14px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.35);text-shadow:0 1px 2px #000}
.rel.big{width:64px;height:64px;font-size:28px}
.wrap{padding:18px max(4vw,14px);display:flex;flex-direction:column;gap:16px;flex:1}
.hero{position:relative;aspect-ratio:16/11;max-height:44vh;width:100%;border-radius:18px;overflow:hidden}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.row-btns{display:flex;gap:12px;flex-wrap:wrap}
.panel{background:rgba(20,8,13,.55);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.center{text-align:center;align-items:center}
/* 용사 선택 */
.heroes{display:grid;gap:14px}
.hc{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;background:rgba(20,8,13,.55);border-radius:18px;padding:12px;border:2px solid transparent;text-align:left}
.hc:active{border-color:var(--gold)}
.hc .spr{max-width:110px}
.hc b{display:block;font:22px "Black Han Sans",sans-serif;font-weight:400}
.hc .tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:9px;background:rgba(255,255,255,.12);white-space:nowrap}
.hc p{font-size:14px;color:var(--soft)}
/* 지도 */
.mapbox{position:relative;width:100%;max-width:520px;margin:0 auto}
.mapbox>svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:58px;min-height:58px;height:58px;border-radius:50%;background:var(--parch);color:var(--ink);display:grid;place-items:center;align-content:center;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.node svg{width:24px;height:24px}.node small{font-size:12px;font-weight:900;line-height:1}
.node.off{opacity:.5;cursor:default}
.node.can{animation:pulse 1.3s ease-in-out infinite;box-shadow:0 0 0 4px var(--gold),0 4px 0 rgba(0,0,0,.45)}
.node.went{opacity:1;box-shadow:0 0 0 4px #b98a2a,0 4px 0 rgba(0,0,0,.45);filter:saturate(.6)}
.n-elite{background:#ffd3c9}.n-boss{background:var(--hp);color:#fff;width:80px;height:80px}
.n-rest{background:#dcf0df}.n-shop{background:#ffefc4}.n-treasure{background:#d3f3ef}.n-event{background:#e6dcf5}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.08)}}
/* 전투 */
.field{position:relative;display:grid;grid-template-columns:minmax(0,32%) minmax(0,1fr);align-items:end;gap:8px;padding:14px 10px 18px;min-height:clamp(260px,42vh,360px);background:linear-gradient(transparent 63%,#5b4a48 63%,#3e3133);overflow:hidden}
.field.boss{background:linear-gradient(#3a0d10,transparent 50%),linear-gradient(transparent 63%,#4a2a26 63%,#2e1a18)}
.field::before{content:"";position:absolute;inset:auto 0 0 0;height:37%;background:repeating-linear-gradient(90deg,transparent 0 70px,rgba(0,0,0,.28) 70px 73px),repeating-linear-gradient(0deg,transparent 0 30px,rgba(0,0,0,.2) 30px 32px);pointer-events:none}
.torch{position:absolute;top:16px;width:14px;height:30px;border-radius:50% 50% 40% 40%;background:radial-gradient(#fff3b0,#ff9a2e 60%,transparent 70%);box-shadow:0 0 60px 30px rgba(255,150,50,.16);animation:flick 1.2s infinite alternate}
@keyframes flick{to{transform:scale(1.08,.92)}}
.ent{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:1}
.spr{width:100%;max-width:130px;aspect-ratio:1}.spr svg{width:100%;height:100%;display:block}
.foes{display:flex;justify-content:space-around;align-items:flex-end;gap:4px}
.foe{flex:1 1 0;max-width:150px;border-radius:14px;padding:4px 3px;border:2px solid transparent}
.foe.sel{border-color:var(--gold);background:rgba(240,192,74,.12)}
.foe.boss{max-width:210px}.foe.boss .spr{max-width:200px}
.foe.dying{animation:die .6s forwards;pointer-events:none}.foe.gone{visibility:hidden;pointer-events:none}
@keyframes die{to{opacity:0;transform:translateY(10px) scale(.85);filter:brightness(3)}}
.lunge .spr{animation:lunge .32s}
@keyframes lunge{40%{transform:translateX(-26px) scale(1.06)}}
.quake{animation:shk .35s}
.nm{font-size:13px;font-weight:700;text-align:center;line-height:1.2;text-shadow:0 1px 2px #000}
.mini{width:100%;height:12px;background:#3d1512;border-radius:6px;position:relative;overflow:hidden}
.mini i{display:block;height:100%;background:#e0482e;transition:width .3s}
.mini span{position:absolute;inset:0;font-size:11px;line-height:12px;text-align:center;font-weight:700;text-shadow:0 1px 1px #000}
.sts{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:20px}
.st{font-size:12px;font-weight:700;padding:1px 6px;border-radius:8px;background:rgba(0,0,0,.5);white-space:nowrap}
.st.blk{background:#4f7c99}.st.vul{background:#8e3fb0}.st.weak{background:#6b6b6b}.st.bleed{background:#a3161e}.st.burn{background:#d9661a}.st.str{background:#b5651d}.st.thorns{background:#5d6b52}.st.keep,.st.plate{background:#55707f}.st.venom{background:#4a8a2a}
.int{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:26px}
.int em{font-style:normal;font-weight:900;font-size:13px;display:inline-flex;align-items:center;gap:2px;background:var(--parch);color:var(--ink);padding:2px 7px;border-radius:10px;white-space:nowrap}
.int em svg{width:14px;height:14px}.int .ia{background:#ffd2c7;color:#8f1f0c}.int .ib{background:#d3e4ee;color:#1d3f55}.int .ih{background:#d4f2dc;color:#1d5a2c}
.res{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(20,8,13,.65);flex-wrap:wrap}
.orb{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold) 55%,#9a6b00);color:#3a2500;display:grid;place-items:center;font:22px "Black Han Sans",sans-serif;box-shadow:0 3px 0 rgba(0,0,0,.4);flex:none}
.mana{display:flex;gap:4px;align-items:center}
.gem{width:16px;height:22px;clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);background:#1d4d49}
.gem.on{background:linear-gradient(#bff7f1,var(--mana) 60%,#178b80)}
.pile{font-size:13px;color:var(--soft);line-height:1.3;text-align:left;min-height:40px}
.res .end{margin-left:auto}
.hand{display:flex;gap:8px;overflow-x:auto;padding:14px 12px 22px;scroll-snap-type:x proximity;justify-content:safe center;min-height:200px}
.hand.deal .card{animation:deal .35s backwards}
.hand.deal .card:nth-child(2){animation-delay:.05s}.hand.deal .card:nth-child(3){animation-delay:.1s}.hand.deal .card:nth-child(4){animation-delay:.15s}.hand.deal .card:nth-child(5){animation-delay:.2s}.hand.deal .card:nth-child(n+6){animation-delay:.25s}
@keyframes deal{from{transform:translateY(80px) rotate(8deg);opacity:0}}
/* 카드 */
.card{--c:var(--skl);flex:none;width:112px;height:160px;border-radius:12px;background:var(--parch);color:var(--ink);position:relative;padding:30px 7px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.4);border-top:22px solid var(--c);scroll-snap-align:center;transition:transform .12s}
.card:active{transform:translateY(-6px)}
.card.t-atk{--c:var(--atk)}.card.t-mag{--c:var(--mag)}.card.t-def{--c:var(--def)}
.card.r-u{box-shadow:0 5px 0 rgba(0,0,0,.4),inset 0 0 0 2px #5aa0e0}
.card.r-r{box-shadow:0 5px 0 rgba(0,0,0,.4),inset 0 0 0 3px var(--gold),0 0 14px rgba(240,192,74,.5)}
.card.no{opacity:.45}
.card.up .cn{color:#2c7a43}
.cost{position:absolute;top:-30px;left:-8px;width:32px;height:32px;border-radius:50%;background:var(--gold);color:#3a2500;display:grid;place-items:center;font:18px "Black Han Sans",sans-serif;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.am{position:absolute;top:-18px;right:8px;display:flex;gap:3px;align-items:center;font-style:normal;font-weight:900;font-size:12px;color:#bff7f1}
.am u{width:10px;height:14px;clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);background:#bff7f1}
.cn{font-weight:900;font-size:14px;line-height:1.15}
.ct{font-size:12px;font-weight:700;color:var(--c);display:flex;align-items:center;gap:3px}
.ct svg{width:12px;height:12px}
.cd{font-size:13px;line-height:1.3;margin-block:auto}
.grid{display:flex;flex-wrap:wrap;gap:22px 12px;justify-content:center;padding-top:14px}
.price{display:block;text-align:center;font-weight:900;color:var(--gold);margin-top:8px}
.sold{opacity:.25;pointer-events:none}
.relrow{display:flex;gap:12px;align-items:center;text-align:left}
.modal{position:fixed;inset:0;background:rgba(20,8,13,.95);z-index:20;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 40px}
.modal .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.mh{display:flex;align-items:center;gap:12px;justify-content:space-between;position:sticky;top:0;background:rgba(20,8,13,.97);padding:6px 0;z-index:2}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1);font-weight:700}
.tog .btn{min-width:84px}
.gl{display:grid;gap:8px}.gl p{font-size:14px}.gl b{color:var(--gold)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.fl{position:fixed;transform:translate(-50%,0);font:26px "Black Han Sans",sans-serif;text-shadow:0 2px 0 #000,0 0 8px #000;animation:up .9s ease-out forwards;white-space:nowrap}
.fl.r{color:#ff6b4f}.fl.b{color:#9cc9e6}.fl.g{color:#7fe0a0}
@keyframes up{to{transform:translate(-50%,-56px);opacity:0}}
.shk{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-7px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.fly{animation:fly .45s ease-in forwards;z-index:31}
@keyframes fly{to{transform:translateY(-170px) scale(.6) rotate(-8deg);opacity:0}}
.banner{position:fixed;left:0;right:0;top:34%;text-align:center;font:clamp(30px,9vw,46px) "Black Han Sans",sans-serif;color:var(--parch);text-shadow:0 3px 0 #000,0 0 20px #000;animation:ban 1.1s ease-out forwards;background:linear-gradient(90deg,transparent,rgba(20,8,13,.75) 20%,rgba(20,8,13,.75) 80%,transparent);padding:8px 0}
@keyframes ban{0%{opacity:0;transform:scaleX(.6)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
#toast{position:fixed;left:50%;bottom:210px;transform:translateX(-50%);background:var(--parch);color:var(--ink);font-weight:900;padding:8px 16px;border-radius:20px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media(max-width:420px){.card{width:100px;height:152px;padding-inline:5px}.hand{justify-content:flex-start}.hc{grid-template-columns:86px minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.shk,.fl,.node.can,.torch,.lunge .spr,.quake,.hand.deal .card,.banner{animation:none}.fly{display:none}.card{transition:none}}
</style></head><body>
<div id="app"></div><div id="fx"></div><div id="toast"></div>
<script>
{
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const KEY='dragon-tower-run-v2',SKEY='dragon-tower-stats-v2',OKEY='dragon-tower-opt';
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let S=null,B=null,M='title',MOD=null,busy=false,FX=[];

/* ================= 소리: 배경음악 + 효과음 (모두 코드로 합성) ================= */
const OPT=Object.assign({music:true,sfx:true},ls.get(OKEY,{}));
const AU={ctx:null,track:null,want:null,next:0,step:0,timer:null,last:{}};
const fq=m=>440*2**((m-69)/12);
function auInit(){if(AU.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=AU.ctx=new C();
 AU.mus=c.createGain();AU.mus.gain.value=OPT.music?.33:0;AU.mus.connect(c.destination);
 AU.fx=c.createGain();AU.fx.gain.value=OPT.sfx?.55:0;AU.fx.connect(c.destination);
 const b=AU.nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 AU.timer=setInterval(sched,25)}catch(e){AU.ctx=null}}
function tone(dst,t,m,dur,type='triangle',vol=.1,att=.01,slide=0,cut=0){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(fq(m),t);if(slide)o.frequency.exponentialRampToValueAtTime(fq(m+slide),t+dur);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 let n=o;if(cut){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;o.connect(f);n=f}n.connect(g);g.connect(dst);o.start(t);o.stop(t+dur+.05)}
function noise(dst,t,dur,vol=.1,freq=3000,type='highpass'){const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.nb;f.type=type;f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(dst);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}
function kick(t,v=.5){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.14);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+.22);o.connect(g);g.connect(AU.mus);o.start(t);o.stop(t+.25)}
const snare=(t,v=.16)=>{noise(AU.mus,t,.14,v,1800,'bandpass');tone(AU.mus,t,55,.08,'triangle',v*.6)};
const hat=(t,v=.035)=>noise(AU.mus,t,.035,v,7500);
const MEL={
menu:[[[0,76],[6,72],[10,74],[12,76]],[[0,77],[6,76],[10,72]],[[0,72],[4,74],[8,76],[12,79]],[[0,74],[8,71],[12,74]],[[0,76],[4,79],[8,81],[12,79]],[[0,77],[8,76],[12,74]],[[0,76],[6,74],[10,72]],[[0,71],[8,74]]],
battle:[[],[],[],[],[[0,74],[3,77],[6,81],[10,79],[12,77]],[[0,77],[4,74],[8,74],[12,77]],[[0,76],[4,79],[8,84],[12,79]],[[0,81],[6,79],[8,76],[12,73]]],
boss:[[[0,76],[3,79],[6,83],[12,81]],[[0,79],[6,76],[8,72],[12,76]],[[0,78],[3,81],[6,86],[12,85]],[[0,83],[4,82],[8,78],[12,75]],[[0,88],[2,86],[4,83],[8,79],[12,83]],[[0,84],[4,79],[8,76],[12,79]],[[0,81],[4,86],[8,85],[12,81]],[[0,78],[4,75],[8,71],[10,75],[12,78]]]
};
const TR={
menu:{bpm:78,ch:[[57,60,64],[53,57,60],[55,60,64],[55,59,62]],play(t,s,ch,sp,bar){
 if(s===0)ch.forEach(m=>tone(AU.mus,t,m,sp*16,'sine',.03,.5));
 if(s===0||s===8)tone(AU.mus,t,ch[0]-12,sp*8,'triangle',.09,.02);
 if(s%2===0)tone(AU.mus,t,ch[[0,1,2,1][(s/2)%4]]+12,sp*3,'triangle',.035,.005);
 MEL.menu[bar].forEach(([at,m])=>{if(at===s)tone(AU.mus,t,m,sp*5,'sine',.06,.02)})}},
battle:{bpm:136,ch:[[50,53,57],[46,50,53],[48,52,55],[45,49,52]],play(t,s,ch,sp,bar){
 if(s===0||s===8||(s===10&&bar%2))kick(t,.45);if(s===4||s===12)snare(t);if(s%2===0)hat(t,s%4?.03:.045);
 if(s%2===0)tone(AU.mus,t,ch[0]-12+(s%4===2?12:0),sp*1.7,'sawtooth',.07,.005,0,900);

const ROWS=12;
function genMap(){const COLS=4,cells=[...Array(ROWS)].map(()=>new Set()),edges=new Set();
 for(let p=0;p<4;p++){let c=p===0?R(0,1):p===1?R(2,3):R(0,3);
  for(let r=0;r<ROWS;r++){cells[r].add(c);if(r===ROWS-1)break;
   const nc=shuf([c-1,c,c+1].filter(x=>x>=0&&x<COLS)).find(x=>x===c||!edges.has(`${r}:${x}>${c}`));edges.add(`${r}:${c}>${nc}`);c=nc}}
 const map=cells.map(s=>[...s].sort((a,b)=>a-b).map(c=>({c,n:[],j:R(-4,4),t:'battle'})));
 edges.forEach(e=>{const[r,rest]=e.split(':'),[a,b]=rest.split('>').map(Number),row=+r;const from=map[row].find(x=>x.c===a),ti=map[row+1].findIndex(x=>x.c===b);if(!from.n.includes(ti))from.n.push(ti)});
 map[ROWS-1].forEach(x=>x.n=[0]);
 map.forEach((row,r)=>row.forEach(x=>{if(r===0)x.t='battle';else if(r===5)x.t='treasure';else if(r===ROWS-1)x.t='rest';else{const q=Math.random();x.t=r>=4&&q<.13?'elite':q<.48?'battle':q<.68?'event':r>=2&&q<.8?'shop':r>=3&&r!==ROWS-2&&q<.92?'rest':'battle'}}));
 map.push([{c:1.5,n:[],j:0,t:'boss'}]);return map}

function newRun(h){const hd=H[h],deck=[];for(const k in hd.deck)for(let i=0;i<hd.deck[k];i++)deck.push(card(k));
 S={hero:h,hp:hd.hp,max:hd.hp,gold:99,floor:0,pos:-1,path:[],map:genMap(),scr:'map',deck,relics:[],seen:[],turns:0};save();render()}
const save=()=>{if(S&&S.scr!=='battle')ls.set(KEY,S)};
const load=()=>{const s=ls.get(KEY,null);return s&&s.deck&&s.hero?s:null};
function proceed(){S.floor++;S.scr='map';MOD=null;S.rw=null;S.ev=null;S.shop=null;save();render()}
function stat(win){const st=ls.get(SKEY,{win:{},best:{}}),h=S.hero;st.best[h]=Math.max(st.best[h]||0,Math.min(S.floor+1,13));if(win)st.win[h]=(st.win[h]||0)+1;ls.set(SKEY,st)}
const W={norm:{c:.6,u:.33,r:.07},elite:{c:.35,u:.45,r:.2},shop:{c:.5,u:.38,r:.12},rare:{c:0,u:.35,r:.65}};
function rollCards(n,mode,upAll){const pool=Object.keys(C).filter(k=>C[k].r!=='b'&&(C[k].h==='all'||C[k].h===S.hero)),w=W[mode],out=[];
 for(let i=0;i<n;i++){const q=Math.random(),rar=q<w.c?'c':q<w.c+w.u?'u':'r';let cand=pool.filter(k=>C[k].r===rar&&!out.includes(k));if(!cand.length)cand=pool.filter(k=>!out.includes(k));out.push(pick(cand))}
 return out.map(k=>card(k,upAll||Math.random()<.1))}

/* ================= 전투 ================= */
const alive=()=>B.en.filter(e=>e.hp>0);
function tg(){let t=B.en[B.tgt];if(!t||t.hp<=0){t=alive()[0];if(t)B.tgt=B.en.indexOf(t)}return t}
function calc(src,dst,v){v+=src.st.str||0;if(src.st.weak)v=Math.floor(v*.75);if(dst.st.vul)v=Math.floor(v*1.5);return Math.max(0,v)}
function dmg(dst,v){const b=Math.min(dst.block,v);dst.block-=b;v-=b;dst.hp=Math.max(0,dst.hp-v);fx(dst.id,v?'-'+v:'막음',v?'r':'b');
 if(dst===B.p){if(v)sfx('hurt');else sfx('block')}else sfx('hit');
 if(dst.k==='dragon'&&!dst.enr&&dst.hp>0&&dst.hp<dst.max/2){dst.enr=1;st(dst,'str',3);banner('용이 격노했다!');sfx('roar')}}
function hit(v,n=1){for(let k=0;k<n;k++){const t=tg();if(!t)return;dmg(t,calc(B.p,t,v+(B.bon||0)))}}
function hitAll(v){alive().forEach(e=>dmg(e,calc(B.p,e,v+(B.bon||0))))}
function blk(v){B.p.block+=v;fx('pl','+'+v+' 방어','b')}
function heal(v){B.p.hp=Math.min(B.p.max,B.p.hp+v);fx('pl','+'+v,'g');sfx('heal')}
function addMana(v){B.mana=Math.min(B.maxM,B.mana+v)}
function st(ent,k,n){if(n>0)ent.st[k]=(ent.st[k]||0)+n}
function pst(ent,k,n){n+=(S.hero==='rogue'&&k==='bleed'?1:0)+(has('fang')?1:0)+(k==='bleed'?(B.p.st.venom||0):0);st(ent,k,n)}
function decay(ent){['vul','weak'].forEach(k=>{if(ent.st[k])ent.st[k]--})}
function dot(ent){[['bleed','출혈'],['burn','화상']].forEach(([k,n])=>{const v=ent.st[k];if(v>0){ent.hp=Math.max(0,ent.hp-v);ent.st[k]--;fx(ent.id,`-${v} ${n}`,'r')}})}
function draw(n){for(let i=0;i<n;i++){if(B.hand.length>=10)return;if(!B.draw.length){if(!B.disc.length)return;B.draw=shuf(B.disc);B.disc=[]}B.hand.push(B.draw.pop())}}
function dead(){if(B.p.hp>0)return false;if(has('phoenix')&&!S.phx){S.phx=1;B.p.hp=Math.ceil(B.p.max*.3);fx('pl','부활!','g');sfx('relic');banner('불사조 깃털이 타올랐다!');return false}return true}
function enc(type){const f=S.floor;if(type==='boss')return['dragon'];
 if(type==='elite')return[pick(['ogre','dk','golem'])].concat(f>6?[pick(['slime','bat','archer'])]:[]);
 return pick(f<4?[['slime'],['bat','slime'],['goblin'],['bat','bat'],['archer']]:[['goblin','bat'],['wolf'],['slime','slime','bat'],['wolf','slime'],['mush','goblin'],['archer','archer'],['mush','wolf'],['archer','bat','slime']])}
function mkEn(k,i){const d=E[k];let hp=R(d.hp[0],d.hp[1]);if(k!=='dragon')hp=Math.round(hp*(1+S.floor*.05));const e={id:'e'+i,k,n:d.n,hp,max:hp,block:0,st:{},li:-1,step:0};nextInt(e);return e}
function nextInt(e){const ai=E[e.k].ai;let i;if(E[e.k].seq)i=e.step++%ai.length;else do{i=R(0,ai.length-1)}while(i===e.li&&ai.length>1);e.li=i;e.int=ai[i]}
function startBattle(type){const h=H[S.hero],maxM=h.maxM+(has('crystal')&&h.maxM?1:0);
 B={type,p:{id:'pl',hp:S.hp,max:S.max,block:S.hero==='knight'?10:0,st:{}},en:enc(type).map(mkEn),draw:shuf(S.deck.map(c=>({...c}))),hand:[],disc:[],exh:[],
  energy:3,maxE:3+(has('core')?1:0),mana:maxM,maxM,drawN:h.drawN-(has('core')?1:0),tgt:0,turn:0,bon:0};
 if(has('spike'))st(B.p,'thorns',3);if(has('scale'))st(B.p,'str',1);
 S.scr='battle';playerTurn(true)}
function playerTurn(first){B.turn++;const p=B.p;if(!first){if(p.st.keep)p.st.keep--;else p.block=0}
 if(p.st.plate)p.block+=p.st.plate;if(has('shell'))p.block+=3;
 dot(p);if(dead())return lose();
 B.energy=B.maxE;if(!first)B.mana=Math.min(B.maxM,B.mana+H[S.hero].regen);
 draw(B.drawN+(first&&has('glass')?2:0));B.deal=1;render();banner(first?(B.type==='boss'?'고대의 붉은 용!':B.type==='elite'?'정예 등장!':'전투 시작!'):'내 차례');sfx('turn')}
function canPlay(c){const d=C[c.id];return B.energy>=cost(c)&&B.mana>=(d.a||0)&&(!d.xa||B.mana>0)}
function play(i){if(busy||MOD)return;const c=B.hand[i];if(!c)return;const d=C[c.id];
 if(B.energy<cost(c)){sfx('err');return toast('행동력이 부족해요')}
 if(B.mana<(d.a||0)||(d.xa&&B.mana<1)){sfx('err');return toast(S.hero==='mage'?'마나가 부족해요 — 명상!':'마나가 부족해요')}
 flyCard(i);B.energy-=cost(c);B.mana-=d.a||0;B.hand.splice(i,1);
 B.bon=(d.t==='atk'&&has('whet')?2:0)+(d.t==='mag'&&has('mark')?3:0);
 sfx(d.t==='atk'?'slash':d.t==='mag'?'magic':d.t==='def'?'block':'card');
 d.f(d.v[c.up?1:0]);B.bon=0;(d.x?B.exh:B.disc).push(c);buzz(12);
 if(dead())return lose();
 if(!alive().length){busy=true;render();return setTimeout(win,650)}
 render()}
async function endTurn(){if(busy||MOD)return;busy=true;B.disc.push(...B.hand);B.hand=[];decay(B.p);render();banner('적의 차례');
 await sleep(500);if(!B)return;
 for(const e of B.en){if(!B)return;if(e.hp<=0)continue;await sleep(300);if(!B)return;e.block=0;dot(e);if(e.hp<=0){render();continue}
  await act(e);if(!B)return;decay(e);nextInt(e);render();
  if(dead()){await sleep(600);busy=false;return lose()}}
 await sleep(300);if(!B)return;busy=false;if(!alive().length)return win();playerTurn()}
async function act(e){const it=e.int,p=B.p;
 if(it.d||it.g){lunge(e.id);await sleep(170)}
 if(it.b){e.block+=it.b;sfx('block');fx(e.id,'+'+it.b+' 방어','b')}
 if(it.s){st(e,'str',it.s);sfx('buff')}
 if(it.h){alive().forEach(a=>{a.hp=Math.min(a.max,a.hp+it.h);fx(a.id,'+'+it.h,'g')});sfx('heal')}
 let db=0;['vul','weak','bleed','burn'].forEach(k=>{if(it[k]){st(p,k,it[k]);db=1}});if(db)sfx('debuff');
 if(it.g){const g=Math.min(S.gold,it.g);S.gold-=g;if(g){fx('pl','금화 -'+g,'r');sfx('coin')}}
 if(it.d){for(let k=0;k<(it.c||1);k++){dmg(p,calc(e,p,it.d));if(p.st.thorns&&e.hp>0)dmg(e,p.st.thorns);if(p.hp<=0||e.hp<=0)break;if(it.c>1)await sleep(120)}buzz(40)}}
function win(){busy=false;if(!B)return;const t=B.type;S.hp=B.p.hp;S.max=B.p.max;S.turns+=B.turn;B=null;
 if(has('grail'))S.hp=Math.min(S.max,S.hp+6);
 if(t==='boss'){stat(true);S.scr='win';ls.del(KEY);jingle(true);return render()}
 sfx('win');let g=t==='elite'?R(35,50):R(14,24);if(has('lucky'))g=Math.round(g*1.5);S.gold+=g;
 let rel=null;if(t==='elite'){rel=rollRelic();if(rel)gainRelic(rel)}
 S.rw={kind:t,gold:g,relic:rel,cards:rollCards(3,t==='elite'?'elite':'norm'),title:t==='elite'?'정예 격파!':'승리!'};S.scr='reward';save();render()}
function lose(){busy=false;if(B){S.hp=0}stat(false);S.scr='lose';ls.del(KEY);jingle(false);render()}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ================= 연출 ================= */
function fx(id,t,c){FX.push([id,t,c])}
function flushFx(){const L=$('#fx');FX.forEach(([id,t,c])=>{const el=document.getElementById(id);if(!el)return;const r=el.getBoundingClientRect(),d=document.createElement('div');d.className='fl '+c;d.textContent=t;d.style.left=(r.left+r.width/2+R(-14,14))+'px';d.style.top=(r.top+r.height*.3)+'px';L.appendChild(d);setTimeout(()=>d.remove(),950);
 if(c==='r'){const s=el.querySelector('.spr');if(s){s.classList.remove('shk');void s.offsetWidth;s.classList.add('shk')}if(id==='pl'){const f=$('.field');if(f){f.classList.remove('quake');void f.offsetWidth;f.classList.add('quake')}}}});FX=[]}
function banner(t){const d=document.createElement('div');d.className='banner';d.textContent=t;$('#fx').appendChild(d);setTimeout(()=>d.remove(),1150)}
function lunge(id){const el=document.getElementById(id);if(el){el.classList.remove('lunge');void el.offsetWidth;el.classList.add('lunge')}}
function flyCard(i){const el=document.querySelector(`.hand [data-i="${i}"]`);if(!el)return;const r=el.getBoundingClientRect(),cl=el.cloneNode(true);cl.removeAttribute('data-a');cl.classList.add('fly');Object.assign(cl.style,{position:'fixed',left:r.left+'px',top:r.top+'px',margin:0});$('#fx').appendChild(cl);setTimeout(()=>cl.remove(),460)}
let tt;function toast(m,ms=1500){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),ms)}

function cardH(c,i,act,ok=true){const d=C[c.id],v=d.v[c.up?1:0];return `<button class="card t-${d.t} r-${d.r} ${ok?'':'no'} ${c.up?'up':''}" data-a="${act}" data-i="${i}"><b class="cost">${cost(c)}</b>${d.a?`<i class="am">${'<u></u>'.repeat(d.a)}</i>`:d.xa?'<i class="am"><u></u>X</i>':''}<span class="cn">${d.n}${c.up?'+':''}</span><span class="ct">${TYI[d.t]}${TL[d.t]}</span><span class="cd">${d.d(v)}</span></button>`}
const STL={vul:'취약',weak:'약화',bleed:'출혈',burn:'화상',str:'힘',thorns:'가시',keep:'방어 유지',plate:'철갑',venom:'맹독'};
function stH(e){let h=e.block?`<span class="st blk">방어 ${e.block}</span>`:'';for(const k in STL)if(e.st[k])h+=`<span class="st ${k}">${STL[k]} ${e.st[k]}</span>`;return `<div class="sts">${h}</div>`}
function intH(e){const it=e.int,p=[];if(it.d)p.push(`<em class="ia">${ICO.sword}${calc(e,B.p,it.d)}${it.c>1?'×'+it.c:''}</em>`);if(it.b)p.push(`<em class="ib">${ICO.shield}${it.b}</em>`);if(it.h)p.push(`<em class="ih">회복 ${it.h}</em>`);if(it.s)p.push(`<em>힘+${it.s}</em>`);if(it.g)p.push(`<em>금화 훔치기</em>`);['vul','weak','bleed','burn'].forEach(k=>{if(it[k])p.push(`<em>${STL[k]}${it[k]}</em>`)});return `<div class="int">${p.join('')}</div>`}
const mini=e=>`<div class="mini"><i style="width:${e.hp/e.max*100}%"></i><span>${e.hp}/${e.max}</span></div>`;
const relH=(k,i)=>`<button class="rel" style="--rc:${RL[k].c}" data-a="relinfo" data-i="${i}" aria-label="${RL[k].n}">${RL[k].n[0]}</button>`;
function topBar(){const hp=B?B.p.hp:S.hp,mx=B?B.p.max:S.max;return `<div class="bar"><div class="hp"><i style="width:${hp/mx*100}%"></i><span>체력 ${hp}/${mx}</span></div><span class="chip gold">금화 ${S.gold}</span><span class="chip">${Math.min(S.floor+1,13)}층</span><button class="btn alt" data-a="deck">덱 ${S.deck.length}</button><button class="ico" data-a="opts" aria-label="설정">${ICO.note}</button>${S.relics.length?`<div class="rels">${S.relics.map(relH).join('')}</div>`:''}</div>`}

const V={
title(){const sv=load();return `<div class="wrap"><div class="hero">${towerSvg}</div>
<h1>용의 탑</h1><p style="font-size:17px" class="soft">세 용사 중 하나를 골라 13층 탑을 오르세요. 카드를 모으고, 유물을 줍고, 꼭대기의 고대 용을 쓰러뜨리면 승리!</p>

map(){const rows=S.map.length,gap=82,H0=60+(rows-1)*gap+50,xy=(r,x)=>[r===rows-1?50:12+x.c*(76/3)+x.j,60+(rows-1-r)*gap];

  const can=r===S.floor&&canGo(i),went=S.path[r]===i;nodes+=`<button class="node n-${x.t} ${can?'can':went?'went':'off'}" style="left:${a}%;top:${b}px" ${can?`data-a="node" data-i="${i}"`:'disabled'} ${can&&!nodes.includes('id="go"')?'id="go"':''} aria-label="${r+1}층 ${NL[x.t]}">${ICO[x.t]}<small>${NL[x.t]}</small></button>`}));
 return topBar()+`<div class="wrap"><div class="row-btns" style="justify-content:space-between;align-items:center"><h2>탑의 지도</h2><button class="btn ghost" data-a="quit">저장하고 나가기</button></div><p class="soft">빛나는 방 중 하나를 고르세요. 길은 선으로 이어진 곳으로만 갈 수 있어요.</p><div class="mapbox" style="height:${H0}px"><svg viewBox="0 0 100 ${H0}" preserveAspectRatio="none">${lines}</svg>${nodes}</div></div>`},

<div class="foes">${B.en.map((e,i)=>{let cls='';if(e.hp<=0){cls=e.fade?'gone':'dying';e.fade=1}return `<button class="ent foe ${i===B.tgt&&e.hp>0?'sel':''} ${e.k==='dragon'?'boss':''} ${cls}" id="${e.id}" data-a="tgt" data-i="${i}">${e.hp>0?intH(e):'<div class="int"></div>'}<div class="spr">${SP[e.k]}</div><div class="nm">${e.n}</div>${mini(e)}${stH(e)}</button>`}).join('')}</div></div>
<div class="res"><div class="orb" aria-label="행동력">${B.energy}/${B.maxE}</div>${B.maxM?`<div><div class="mana">${[...Array(B.maxM)].map((_,i)=>`<span class="gem ${i<B.mana?'on':''}"></span>`).join('')}</div><div class="pile">마나 ${B.mana}/${B.maxM}</div></div>`:''}<button class="pile" data-a="pdraw">뽑을 카드 ${B.draw.length}<br>버린 카드 ${B.disc.length}</button><button class="ico" data-a="help" aria-label="도움말" style="font-weight:900">?</button><button class="btn end" data-a="end" ${busy?'disabled':''}>${busy?'적의 차례…':'턴 종료'}</button></div>
<div class="hand ${deal?'deal':''}">${B.hand.map((c,i)=>cardH(c,i,'play',canPlay(c))).join('')||'<p class="soft" style="padding:40px 0">손패가 비었어요</p>'}</div>`},
reward(){const w=S.rw;return topBar()+`<div class="wrap"><div class="panel center"><h2>${w.title}</h2>${w.gold?`<p class="gold" style="font-weight:900">금화 +${w.gold}</p>`:''}${w.relic?`<div class="relrow">${relH(w.relic,S.relics.indexOf(w.relic)).replace('class="rel"','class="rel big"')}<div><b>유물 「${RL[w.relic].n}」</b><p class="soft">${RL[w.relic].d}</p></div></div>`:''}</div><div class="panel"><p style="font-weight:700">덱에 넣을 카드 1장을 고르세요</p><div class="grid">${w.cards.map((c,i)=>cardH(c,i,'pickc')).join('')}</div></div><button class="btn alt" data-a="next">카드 없이 계속</button></div>`},
treasure(){const w=S.rw;return topBar()+`<div class="wrap"><div class="panel center"><svg viewBox="0 0 24 24" width="80" height="80">${ICO.treasure.replace(/<\/?svg[^>]*>/g,'')}</svg><h2>먼지 쌓인 보물상자</h2><p class="gold" style="font-weight:900">금화 +${w.gold}</p>${w.relic?`<div class="relrow">${relH(w.relic,S.relics.indexOf(w.relic)).replace('class="rel"','class="rel big"')}<div><b>유물 「${RL[w.relic].n}」</b><p class="soft">${RL[w.relic].d}</p></div></div>`:''}</div>${w.cards.length?`<div class="grid">${w.cards.map((c,i)=>cardH(c,i,'pickc')).join('')}</div>`:''}<button class="btn" data-a="next">계속</button></div>`},
shop(){const s=S.shop;return topBar()+`<div class="wrap"><h2>떠돌이 상인</h2><p class="soft">"좋은 물건 많다네. 금화만 있다면야."</p><div class="grid">${s.items.map((it,i)=>`<div class="${it.sold?'sold':''}">${cardH(it.c,i,'buy',S.gold>=it.p)}<span class="price">${it.p} 금화</span></div>`).join('')}</div>
${s.rel?`<div class="panel ${s.rel.sold?'sold':''}"><div class="relrow">${relH(s.rel.k,0).replace('data-a="relinfo"','data-a="none"').replace('class="rel"','class="rel big"')}<div style="flex:1"><b>유물 「${RL[s.rel.k].n}」</b><p class="soft">${RL[s.rel.k].d}</p></div><button class="btn alt" data-a="buyrel" ${S.gold<s.rel.p?'disabled':''}>${s.rel.p} 금화</button></div></div>`:''}
<div class="panel"><div class="row-btns"><button class="btn alt" data-a="srm" ${s.rm||S.gold<60||S.deck.length<6?'disabled':''}>카드 1장 버리기 · 60</button><button class="btn alt" data-a="sheal" ${s.heal||S.gold<40||S.hp>=S.max?'disabled':''}>체력 20 회복 · 40</button></div></div><button class="btn" data-a="next">다음 층으로</button></div>`},
rest(){return topBar()+`<div class="wrap"><div class="panel center"><svg viewBox="0 0 24 24" width="90" height="90">${ICO.rest.replace(/<\/?svg[^>]*>/g,'')}</svg><h2>계단참의 모닥불</h2><p class="soft">잠시 쉬어 가거나, 장비를 손질하세요.</p></div><div class="row-btns"><button class="btn" data-a="rheal">휴식 · 체력 ${Math.ceil(S.max*.3)} 회복</button><button class="btn alt" data-a="rup" ${S.deck.every(c=>c.up)?'disabled':''}>카드 1장 강화</button></div></div>`},
event(){const ev=EV[S.ev.i];return topBar()+`<div class="wrap"><div class="panel center"><svg viewBox="0 0 24 24" width="70" height="70" style="color:#e6dcf5">${ICO.event.replace(/<\/?svg[^>]*>/g,'').replaceAll('#5a3a8a','#e6dcf5')}</svg><h2>${ev.t}</h2><p style="font-size:17px">${S.ev.res||ev.d}</p></div>
${S.ev.res?'<button class="btn" data-a="next">계속</button>':`<div class="row-btns" style="flex-direction:column">${ev.o.map((o,i)=>`<button class="btn ${i?'alt':''}" data-a="evo" data-i="${i}" ${o.need&&!o.need()?'disabled':''}>${o.l}</button>`).join('')}</div>`}</div>`},
win(){return `<div class="wrap" style="justify-content:center;text-align:center;align-items:center"><div class="spr" style="max-width:200px">${SP[S.hero]}</div><h1>용을 쓰러뜨렸다!</h1><p>${H[S.hero].n}, 탑 꼭대기에 깃발을 꽂았어요.</p><p class="soft">덱 ${S.deck.length}장 · 유물 ${S.relics.length}개 · 남은 체력 ${S.hp} · ${S.turns}턴</p><button class="btn" data-a="pickhero">다른 용사로 도전</button><button class="btn alt" data-a="title">처음으로</button></div>`},
lose(){return `<div class="wrap" style="justify-content:center;text-align:center;align-items:center"><div class="spr" style="max-width:180px;filter:grayscale(1)">${SP[S.hero]}</div><h1>원정 실패…</h1><p>${H[S.hero].n}, ${S.floor+1}층에서 쓰러졌어요.</p><p class="soft">덱 ${S.deck.length}장 · 유물 ${S.relics.length}개</p><button class="btn" data-a="pickhero">다시 도전</button><button class="btn alt" data-a="title">처음으로</button></div>`}
};
function modalH(){if(!MOD)return'';const m=MOD.m;let title='',body='';
 if(m==='view'||m==='remove'||m==='upgrade'){title={view:'내 덱',remove:MOD.ctx==='shop'?'버릴 카드를 고르세요 (60 금화)':'잊을 카드를 고르세요',upgrade:'강화할 카드를 고르세요'}[m];
  const list=S.deck.map((c,i)=>[c,i]).sort((a,b)=>a[0].id.localeCompare(b[0].id));
  body=`<div class="grid">${list.map(([c,i])=>m==='upgrade'&&c.up?'':cardH(m==='upgrade'?{...c,up:true}:c,i,m==='view'?'none':'mpick')).join('')}</div>${m==='upgrade'?'<p class="soft" style="text-align:center">강화된 모습으로 보여요</p>':''}`}
 else if(m==='pile'){title='뽑을 카드 (순서는 비밀)';body=`<div class="grid">${[...B.draw].sort((a,b)=>a.id.localeCompare(b.id)).map((c,i)=>cardH(c,i,'none')).join('')||'<p class="soft">없음</p>'}</div><h3 style="margin-top:18px">버린 카드</h3><div class="grid">${B.disc.map((c,i)=>cardH(c,i,'none')).join('')||'<p class="soft">없음</p>'}</div>`}
 else if(m==='help'){title='도움말';body=`<div class="gl"><p><b>행동력</b> 카드 왼쪽 위 숫자만큼 써요. 매 턴 다시 차요.</p><p><b>마나</b> 카드 오른쪽 위 마름모만큼 써요. 용사마다 회복량이 달라요.</p><p><b>적 머리 위 표시</b> 다음 행동이에요. 칼은 공격(숫자 × 횟수), 방패는 방어도.</p><p><b>방어도</b> 받는 피해를 먼저 막아요. 내 턴이 시작되면 사라져요.</p><p><b>취약</b> 받는 피해 50% 증가. <b>약화</b> 주는 피해 25% 감소.</p><p><b>출혈·화상</b> 턴 시작마다 수치만큼 피해를 입고 1 줄어요.</p><p><b>힘</b> 공격 피해가 수치만큼 늘어요. <b>가시</b> 공격받을 때마다 수치만큼 되돌려줘요.</p><p><b>소멸</b> 쓰면 이번 전투 동안 덱에서 빠져요.</p><p>적을 눌러 공격 대상을 바꿀 수 있어요.</p></div>`}
 else if(m==='opts'){title='설정';body=`<div class="tog"><span>배경음악</span><button class="btn ${OPT.music?'':'alt'}" data-a="tmusic">${OPT.music?'켜짐':'꺼짐'}</button></div><div class="tog"><span>효과음</span><button class="btn ${OPT.sfx?'':'alt'}" data-a="tsfx">${OPT.sfx?'켜짐':'꺼짐'}</button></div>${S&&S.scr!=='win'&&S.scr!=='lose'?`<div class="tog"><span>이번 원정 포기</span><button class="btn alt" data-a="abandon">${MOD.sure?'정말 포기':'포기하기'}</button></div>`:''}`}
 return `<div class="modal"><div class="in"><div class="mh"><h2 style="font-size:24px">${title}</h2><button class="btn alt" data-a="mclose">닫기</button></div>${body}</div></div>`}
function render(){const scr=S?S.scr:M;$('#app').innerHTML=(S?V[scr]():V[M]())+modalH();
 if(scr==='map'&&!MOD){const g=$('#go');if(g)g.scrollIntoView({block:'center'})}
 music(scr==='battle'?(B&&B.type==='boss'?'boss':'battle'):(scr==='win'||scr==='lose')?null:'menu');flushFx()}

/* ================= 입력 ================= */
const A={
pickhero(){S=null;B=null;M='pick';render()},
hero(i){sfx('click');newRun(HK[i])},
cont(){S=load();if(S){S.scr=S.scr==='battle'?'map':S.scr;MOD=null}render()},
title(){S=null;B=null;M='title';render()},
quit(){save();S=null;M='title';render()},
node(i){if(S.floor>=S.map.length||!canGo(i))return;sfx('click');S.pos=i;S.path[S.floor]=i;const t=S.map[S.floor][i].t;
 if(t==='battle'||t==='elite'||t==='boss')return startBattle(t);
 if(t==='rest')S.scr='rest';
 else if(t==='shop'){const rk=rollRelic();S.shop={items:rollCards(5,'shop').map(c=>({c,p:price(c),sold:0})),rel:rk?{k:rk,p:R(140,170),sold:0}:null,rm:0,heal:0};S.scr='shop'}
 else if(t==='event'){let opts=EV.map((_,k)=>k).filter(k=>!S.seen.includes(k));if(!opts.length)opts=EV.map((_,k)=>k);const k=pick(opts);S.seen.push(k);S.ev={i:k,res:null};S.scr='event'}
 else{let g=R(40,70);if(has('lucky'))g=Math.round(g*1.5);S.gold+=g;const rel=rollRelic();if(rel)gainRelic(rel);S.rw={gold:g,relic:rel,cards:rel?[]:rollCards(2,'rare',true)};S.scr='treasure';sfx('coin')}
 save();render()},
play,
tgt(i){if(busy||!B.en[i]||B.en[i].hp<=0)return;B.tgt=i;sfx('click');render()},
end(){sfx('click');endTurn()},
pickc(i){S.deck.push(S.rw.cards[i]);sfx('card');proceed()},
next(){sfx('click');proceed()},
buy(i){const it=S.shop.items[i];if(it.sold)return;if(S.gold<it.p){sfx('err');return toast('금화가 부족해요')}S.gold-=it.p;it.sold=1;S.deck.push(it.c);sfx('coin');save();render()},
buyrel(){const r=S.shop.rel;if(!r||r.sold||S.gold<r.p)return;S.gold-=r.p;r.sold=1;gainRelic(r.k);save();render()},
srm(){MOD={m:'remove',ctx:'shop'};render()},
sheal(){S.gold-=40;S.hp=Math.min(S.max,S.hp+20);S.shop.heal=1;sfx('heal');save();render()},
rheal(){S.hp=Math.min(S.max,S.hp+Math.ceil(S.max*.3));sfx('heal');proceed()},
rup(){MOD={m:'upgrade',ctx:'rest'};render()},
evo(i){const o=EV[S.ev.i].o[i];if(o.need&&!o.need())return;const r=o.f();if(r)S.ev.res=r;save();render()},
deck(){MOD={m:'view'};render()},
pdraw(){MOD={m:'pile'};render()},
help(){MOD={m:'help'};render()},
opts(){MOD={m:'opts'};render()},
tmusic(){setOpt('music');render()},
tsfx(){setOpt('sfx');render()},
abandon(){if(!MOD.sure){MOD.sure=1;return render()}MOD=null;B=null;busy=false;stat(false);ls.del(KEY);S=null;M='title';render()},
mclose(){if(MOD&&(MOD.ctx==='event')&&!S.ev.res)S.ev.res='마음을 바꿨다.';MOD=null;render()},
mpick(i){const m=MOD.m,ctx=MOD.ctx;
 if(m==='remove'){const c=S.deck.splice(i,1)[0];if(ctx==='shop'){S.gold-=60;S.shop.rm=1}else S.ev.res=`「${C[c.id].n}」 카드를 덱에서 지웠다.`}
 else if(m==='upgrade'){S.deck[i].up=true;sfx('relic');if(ctx==='rest'){MOD=null;return proceed()}S.ev.res=`「${C[S.deck[i].id].n}」 카드가 강해졌다!`}
 MOD=null;save();render()},
relinfo(i){const k=S.relics[i];if(k)toast(`${RL[k].n} — ${RL[k].d}`,2600)},
none(){}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=A[t.dataset.a];if(f)f(+t.dataset.i)});
document.addEventListener('keydown',e=>{if(S&&S.scr==='battle'&&!MOD){if(e.key==='e'||e.key==='E')endTurn();const n=+e.key;if(n>=1&&n<=9)play(n-1)}});
render();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
</script></body></html>
