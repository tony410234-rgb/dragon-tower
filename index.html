<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2a1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>용의 탑</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 동화책 같은 판타지 모험, 한 판 15~25분
   IDEA: 횃불 켜진 탑을 한 층씩 오르는 원정 일지와 카드 테이블
   PICTURE: 돌바닥 위에서 마주 선 용사와 괴물들, 갈림길 지도
   COLOUR+TYPE: 깊은 와인빛 돌벽, 양피지 카드, 청록 마나, 붉은 체력 / Black Han Sans + Noto Sans KR
   LAYOUT: 상단 상태바, 가운데 전장, 하단 손패 — 폰 세로 화면 전용 */
:root{color-scheme:dark;--wall:#4a2230;--deep:#1c0d15;--parch:#f5ecd9;--ink:#24151b;--hp:#e5452f;--gold:#f0c04a;--mana:#3fd1c4;--atk:#c93a2a;--mag:#2a8fd8;--def:#5b7a8c;--skl:#3f9a5a;--soft:#e8c9b0}
*{box-sizing:border-box;min-width:0}
html,body{min-height:100%;overscroll-behavior:none}
body{margin:0;background:radial-gradient(130% 70% at 50% 0,#6a2f40,var(--wall) 45%,var(--deep));background-attachment:fixed;color:var(--parch);font:15px/1.45 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3{font-family:"Black Han Sans",sans-serif;font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(40px,12vw,60px)}h2{font-size:30px}h3{font-size:22px}
p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;min-height:44px;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{background:var(--hp);color:#fff;border-radius:12px;padding:10px 20px;font-weight:900;box-shadow:0 4px 0 #8f2416}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f2416}
.btn.alt{background:var(--parch);color:var(--ink);box-shadow:0 4px 0 #b4a688}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--parch);box-shadow:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.soft{color:var(--soft)}
.bar{display:flex;align-items:center;gap:8px 12px;padding:8px 12px;background:rgba(20,8,13,.7);font-weight:700;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.hp{flex:1 1 130px;height:18px;background:#3d1512;border-radius:9px;overflow:hidden;position:relative}
.hp i{display:block;height:100%;background:linear-gradient(#ff7c62,#c93a2a);transition:width .3s}
.hp span{position:absolute;inset:0;text-align:center;font-size:13px;line-height:18px;text-shadow:0 1px 2px #000}
.gold{color:var(--gold)}.chip{white-space:nowrap;font-size:14px}
.bar .btn{min-height:36px;padding:4px 10px;font-size:14px}
.ico{width:36px;min-height:36px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.1)}
.ico svg{width:20px;height:20px}
.rels{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap}
.rel{width:30px;min-height:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,transparent 45%),var(--rc);color:#fff;font-weight:900;font-size:14px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.35);text-shadow:0 1px 2px #000}
.rel.big{width:64px;height:64px;font-size:28px}
.wrap{padding:18px max(4vw,14px);display:flex;flex-direction:column;gap:16px;flex:1}
.hero{position:relative;aspect-ratio:16/11;max-height:44vh;width:100%;border-radius:18px;overflow:hidden}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.row-btns{display:flex;gap:12px;flex-wrap:wrap}
.panel{background:rgba(20,8,13,.55);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.center{text-align:center;align-items:center}
/* 용사 선택 */
.heroes{display:grid;gap:14px}
.hc{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;background:rgba(20,8,13,.55);border-radius:18px;padding:12px;border:2px solid transparent;text-align:left}
.hc:active{border-color:var(--gold)}
.hc .spr{max-width:110px}
.hc b{display:block;font:22px "Black Han Sans",sans-serif;font-weight:400}
.hc .tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:9px;background:rgba(255,255,255,.12);white-space:nowrap}
.hc p{font-size:14px;color:var(--soft)}
/* 지도 */
.mapbox{position:relative;width:100%;max-width:520px;margin:0 auto}
.mapbox>svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:58px;min-height:58px;height:58px;border-radius:50%;background:var(--parch);color:var(--ink);display:grid;place-items:center;align-content:center;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.node svg{width:24px;height:24px}.node small{font-size:12px;font-weight:900;line-height:1}
.node.off{opacity:.5;cursor:default}
.node.can{animation:pulse 1.3s ease-in-out infinite;box-shadow:0 0 0 4px var(--gold),0 4px 0 rgba(0,0,0,.45)}
.node.went{opacity:1;box-shadow:0 0 0 4px #b98a2a,0 4px 0 rgba(0,0,0,.45);filter:saturate(.6)}
.n-elite{background:#ffd3c9}.n-boss{background:var(--hp);color:#fff;width:80px;height:80px}
.n-rest{background:#dcf0df}.n-shop{background:#ffefc4}.n-treasure{background:#d3f3ef}.n-event{background:#e6dcf5}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.08)}}
/* 전투 */
.field{position:relative;display:grid;grid-template-columns:minmax(0,32%) minmax(0,1fr);align-items:end;gap:8px;padding:14px 10px 18px;min-height:clamp(260px,42vh,360px);background:linear-gradient(transparent 63%,#5b4a48 63%,#3e3133);overflow:hidden}
.field.a1.boss{background:linear-gradient(#3a0d10,transparent 50%),linear-gradient(transparent 63%,#4a2a26 63%,#2e1a18)}
.field::before{content:"";position:absolute;inset:auto 0 0 0;height:37%;background:repeating-linear-gradient(90deg,transparent 0 70px,rgba(0,0,0,.28) 70px 73px),repeating-linear-gradient(0deg,transparent 0 30px,rgba(0,0,0,.2) 30px 32px);pointer-events:none}
.torch{position:absolute;top:16px;width:14px;height:30px;border-radius:50% 50% 40% 40%;background:radial-gradient(#fff3b0,#ff9a2e 60%,transparent 70%);box-shadow:0 0 60px 30px rgba(255,150,50,.16);animation:flick 1.2s infinite alternate}
@keyframes flick{to{transform:scale(1.08,.92)}}
.ent{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:1}
.spr{width:100%;max-width:130px;aspect-ratio:1}.spr svg{width:100%;height:100%;display:block}
.foes{display:flex;justify-content:space-around;align-items:flex-end;gap:4px}
.foe{flex:1 1 0;max-width:150px;border-radius:14px;padding:4px 3px;border:2px solid transparent}
.foe.sel{border-color:var(--gold);background:rgba(240,192,74,.12)}
.foe.boss{max-width:210px}.foe.boss .spr{max-width:200px}
.foe.dying{animation:die .6s forwards;pointer-events:none}.foe.gone{visibility:hidden;pointer-events:none}
@keyframes die{to{opacity:0;transform:translateY(10px) scale(.85);filter:brightness(3)}}
.lunge .spr{animation:lunge .32s}
@keyframes lunge{40%{transform:translateX(-26px) scale(1.06)}}
.quake{animation:qk .35s}
@keyframes qk{20%{transform:translateX(-8px)}50%{transform:translateX(7px)}80%{transform:translateX(-3px)}}
.nm{font-size:13px;font-weight:700;text-align:center;line-height:1.2;text-shadow:0 1px 2px #000}
.mini{width:100%;height:12px;background:#3d1512;border-radius:6px;position:relative;overflow:hidden}
.mini i{display:block;height:100%;background:#e0482e;transition:width .3s}
.mini span{position:absolute;inset:0;font-size:11px;line-height:12px;text-align:center;font-weight:700;text-shadow:0 1px 1px #000}
.sts{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:20px}
.st{font-size:12px;font-weight:700;padding:1px 6px;border-radius:8px;background:rgba(0,0,0,.5);white-space:nowrap}
.st.blk{background:#4f7c99}.st.vul{background:#8e3fb0}.st.weak{background:#6b6b6b}.st.bleed{background:#a3161e}.st.burn{background:#d9661a}.st.str{background:#b5651d}.st.thorns{background:#5d6b52}.st.keep,.st.plate{background:#55707f}.st.venom{background:#4a8a2a}
.int{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:26px}
.int em{font-style:normal;font-weight:900;font-size:13px;display:inline-flex;align-items:center;gap:2px;background:var(--parch);color:var(--ink);padding:2px 7px;border-radius:10px;white-space:nowrap}
.int em svg{width:14px;height:14px}.int .ia{background:#ffd2c7;color:#8f1f0c}.int .ib{background:#d3e4ee;color:#1d3f55}.int .ih{background:#d4f2dc;color:#1d5a2c}
.res{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(20,8,13,.65);flex-wrap:wrap}
.orb{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold) 55%,#9a6b00);color:#3a2500;display:grid;place-items:center;font:22px "Black Han Sans",sans-serif;box-shadow:0 3px 0 rgba(0,0,0,.4);flex:none}
.mana{display:flex;gap:4px;align-items:center}
.gem{width:16px;height:22px;clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);background:#1d4d49}
.gem.on{background:linear-gradient(#bff7f1,var(--mana) 60%,#178b80)}
.pile{font-size:13px;color:var(--soft);line-height:1.3;text-align:left;min-height:40px}
.res .end{margin-left:auto}
.hand{display:flex;gap:8px;overflow-x:auto;padding:14px 12px 22px;scroll-snap-type:x proximity;justify-content:safe center;min-height:200px}
.hand.deal .card{animation:deal .35s backwards}
.hand.deal .card:nth-child(2){animation-delay:.05s}.hand.deal .card:nth-child(3){animation-delay:.1s}.hand.deal .card:nth-child(4){animation-delay:.15s}.hand.deal .card:nth-child(5){animation-delay:.2s}.hand.deal .card:nth-child(n+6){animation-delay:.25s}
@keyframes deal{from{transform:translateY(80px) rotate(8deg);opacity:0}}
/* 카드 */
.card{--c:var(--skl);flex:none;width:112px;height:166px;border-radius:12px;background:linear-gradient(#fbf5e6,#ecdcbb);color:var(--ink);position:relative;padding:0 0 8px;display:flex;flex-direction:column;align-items:stretch;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.4),inset 0 0 0 2px #5a3a28;scroll-snap-align:center;transition:transform .12s}
.card:active{transform:translateY(-6px)}
.card.t-atk{--c:var(--atk)}.card.t-mag{--c:var(--mag)}.card.t-def{--c:var(--def)}
.card::after{content:"";position:absolute;bottom:-6px;left:50%;width:11px;height:11px;transform:translateX(-50%) rotate(45deg);background:#a8987c;box-shadow:0 0 0 2px #3a2418}
.card.r-u::after{background:#5aa0e0}.card.r-r::after{background:var(--gold);box-shadow:0 0 0 2px #3a2418,0 0 10px var(--gold)}
.card.r-r{box-shadow:0 5px 0 rgba(0,0,0,.4),inset 0 0 0 2px #5a3a28,0 0 16px rgba(240,192,74,.45)}
.card.no{opacity:.45;filter:grayscale(.3)}
.card.up .cn{color:#e6ffc0}
.cost{position:absolute;top:-10px;left:-10px;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold) 60%,#9a6b00);color:#3a2500;display:grid;place-items:center;font:18px "Black Han Sans",sans-serif;box-shadow:0 2px 0 rgba(0,0,0,.45);z-index:2}
.am{position:absolute;top:-9px;right:-4px;display:flex;gap:2px;align-items:center;font-style:normal;font-weight:900;font-size:12px;color:#bff7f1;background:#123a3c;padding:3px 5px;border-radius:9px;box-shadow:0 2px 0 rgba(0,0,0,.4);z-index:2}
.am u{width:9px;height:13px;clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);background:#bff7f1}
.cn{background:var(--c);color:#fff;font-weight:900;font-size:13px;line-height:1.1;padding:6px 8px 5px 22px;border-radius:10px 10px 0 0;text-shadow:0 1px 1px rgba(0,0,0,.5);min-height:28px;display:grid;place-items:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.art{height:50px;margin:5px 7px 0;border-radius:7px;display:grid;place-items:center;background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.55),transparent 62%),var(--c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),inset 0 -12px 18px rgba(0,0,0,.28)}
.art svg{width:36px;height:36px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.ct{font-size:11px;font-weight:900;color:var(--c);margin-top:3px}
.cd{font-size:13px;line-height:1.25;padding:0 5px;margin-block:auto}
.grid{display:flex;flex-wrap:wrap;gap:22px 12px;justify-content:center;padding-top:14px}
.price{display:block;text-align:center;font-weight:900;color:var(--gold);margin-top:8px}
.sold{opacity:.25;pointer-events:none}
.relrow{display:flex;gap:12px;align-items:center;text-align:left}
.modal{position:fixed;inset:0;background:rgba(20,8,13,.95);z-index:20;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 40px}
.modal .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.mh{display:flex;align-items:center;gap:12px;justify-content:space-between;position:sticky;top:0;background:rgba(20,8,13,.97);padding:6px 0;z-index:2}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1);font-weight:700}
.tog .btn{min-width:84px}
.gl{display:grid;gap:8px}.gl p{font-size:14px}.gl b{color:var(--gold)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.fl{position:fixed;transform:translate(-50%,0);font:26px "Black Han Sans",sans-serif;text-shadow:0 2px 0 #000,0 0 8px #000;white-space:nowrap}
.fl.r{color:#ff6b4f}.fl.b{color:#9cc9e6}.fl.g{color:#7fe0a0}
@keyframes up{to{transform:translate(-50%,-56px);opacity:0}}
.shk{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-7px);filter:brightness(2.4) saturate(.4)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.fly{animation:fly .45s ease-in forwards;z-index:31}
@keyframes fly{to{transform:translateY(-170px) scale(.6) rotate(-8deg);opacity:0}}
.banner{position:fixed;left:0;right:0;top:34%;text-align:center;font:clamp(30px,9vw,46px) "Black Han Sans",sans-serif;color:var(--parch);text-shadow:0 3px 0 #000,0 0 20px #000;animation:ban 1.1s ease-out forwards;background:linear-gradient(90deg,transparent,rgba(20,8,13,.75) 20%,rgba(20,8,13,.75) 80%,transparent);padding:8px 0}
@keyframes ban{0%{opacity:0;transform:scaleX(.6)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
#toast{position:fixed;left:50%;bottom:210px;transform:translateX(-50%);background:var(--parch);color:var(--ink);font-weight:900;padding:8px 16px;border-radius:20px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media(max-width:420px){.card{width:102px;height:160px}.cd{font-size:12.5px}.hand{justify-content:flex-start}.hc{grid-template-columns:86px minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.shk,.fl,.node.can,.torch,.lunge .spr,.quake,.hand.deal .card,.banner{animation:none}.fly{display:none}.card{transition:none}}
.vx{position:fixed;pointer-events:none;will-change:transform,opacity;z-index:32}
.vx.orb{border-radius:50%;background:radial-gradient(circle,#fff 0 22%,var(--c) 45%,transparent 72%);box-shadow:0 0 26px 10px var(--c)}
.vx.dg{border-radius:40%;background:linear-gradient(90deg,transparent,var(--c),#fff);box-shadow:0 0 10px var(--c)}
.vx.rg{width:74px;height:74px;border-radius:50%;border:4px solid #fff}
.vx.pt{border-radius:50%}
.vx.full{left:0;top:0;width:100vw;height:100vh;mix-blend-mode:screen}
.vx.vg{mix-blend-mode:normal;box-shadow:inset 0 0 90px 30px rgba(220,30,20,.75)}
.vx.shd{width:120px;height:130px;border-radius:50% 50% 46% 46%;border:3px solid #9cc9e6;background:radial-gradient(transparent 50%,rgba(156,201,230,.4));box-shadow:0 0 22px #9cc9e6}
.vx.rs{font:900 22px "Noto Sans KR",sans-serif;text-shadow:0 0 8px currentColor}
.vx.fl{font-family:"Black Han Sans",sans-serif;text-shadow:0 3px 0 #000,0 0 10px #000;white-space:nowrap;line-height:1}
.vx.fl.crit{color:#ffe066;-webkit-text-stroke:1px #7a2a00}
.field .spr svg{animation:idle 2.6s ease-in-out infinite;transform-origin:50% 92%}
.foe:nth-child(2) .spr svg{animation-delay:-.9s}.foe:nth-child(3) .spr svg{animation-delay:-1.7s}
@keyframes idle{50%{transform:scale(.985,1.025)}}
.bar.lobby{gap:10px}
.logo{font:24px "Black Han Sans",sans-serif;font-weight:400;color:var(--gold)}
.shard{display:inline-flex;align-items:center;gap:4px;font-weight:900;white-space:nowrap}.shard svg{width:20px;height:20px}
.stage{position:relative;aspect-ratio:4/3.4;max-height:50vh;width:100%;border-radius:20px;overflow:hidden}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
.stage .plat{position:absolute;left:50%;bottom:17%;width:50%;height:10%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(rgba(240,192,74,.45),transparent 70%)}
.stage .spr{position:absolute;left:50%;bottom:17%;width:54%;max-width:250px;transform:translateX(-50%)}
.spr.show svg{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.nameplate{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:linear-gradient(transparent,rgba(20,8,13,.92));display:flex;flex-direction:column}
.nameplate b{font:24px "Black Han Sans",sans-serif;font-weight:400}.nameplate span{font-size:13px;color:var(--soft)}
.btn.big{flex:1 1 160px;min-height:56px;font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;background:rgba(20,8,13,.55);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:72px;border:1px solid rgba(255,255,255,.08)}
.tile b{font:20px "Black Han Sans",sans-serif;font-weight:400}.tile span{font-size:13px;color:var(--soft)}
.dot{position:absolute;top:10px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--hp);box-shadow:0 0 0 3px rgba(229,69,47,.3)}
.hp2.on{box-shadow:inset 0 0 0 2px var(--gold)}
.hc2{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;align-items:center}
.hn{display:block;font:22px "Black Han Sans",sans-serif;font-weight:400}
.skins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sk{background:rgba(255,255,255,.06);border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent}
.sk.on{border-color:var(--gold)}.sk .spr{max-width:72px}.sk b{font-size:13px}.sk span{font-size:12px;color:var(--soft);display:inline-flex;align-items:center;gap:2px}.sk span svg{width:14px;height:14px}
.grow{flex-direction:row;align-items:center;gap:12px}.grow b{font-size:17px}.lv{font-size:13px;color:var(--gold);font-weight:700}
.grow .btn{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}.grow .btn svg{width:18px;height:18px}
.pips{display:flex;gap:4px;margin-top:6px}.pips i{width:22px;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}.pips i.on{background:var(--gold)}

const ROWS=12;
function genMap(){const COLS=4,cells=[...Array(ROWS)].map(()=>new Set()),edges=new Set();
 for(let p=0;p<4;p++){let c=p===0?R(0,1):p===1?R(2,3):R(0,3);
  for(let r=0;r<ROWS;r++){cells[r].add(c);if(r===ROWS-1)break;
   const nc=shuf([c-1,c,c+1].filter(x=>x>=0&&x<COLS)).find(x=>x===c||!edges.has(`${r}:${x}>${c}`));edges.add(`${r}:${c}>${nc}`);c=nc}}
 const map=cells.map(s=>[...s].sort((a,b)=>a-b).map(c=>({c,n:[],j:R(-4,4),t:'battle'})));
 edges.forEach(e=>{const[r,rest]=e.split(':'),[a,b]=rest.split('>').map(Number),row=+r;const from=map[row].find(x=>x.c===a),ti=map[row+1].findIndex(x=>x.c===b);if(!from.n.includes(ti))from.n.push(ti)});
 map[ROWS-1].forEach(x=>x.n=[0]);
 map.forEach((row,r)=>row.forEach(x=>{if(r===0)x.t='battle';else if(r===5)x.t='treasure';else if(r===ROWS-1)x.t='rest';else{const q=Math.random();x.t=r>=4&&q<.13?'elite':q<.48?'battle':q<.68?'event':r>=2&&q<.8?'shop':r>=3&&r!==ROWS-2&&q<.92?'rest':'battle'}}));
 map.push([{c:1.5,n:[],j:0,t:'boss'}]);return map}

 const hp=hd.hp+(META.up.hp||0)*4;S={hero:h,hp,max:hp,gold:99+(META.up.gold||0)*25,floor:0,pos:-1,path:[],map:genMap(),scr:'map',deck,relics:[],seen:[],turns:0,act:1,k:{n:0,e:0,b:0}};if(META.up.relic){const r=rollRelic();if(r)gainRelic(r)}save();render()}

function stat(win){const st=ls.get(SKEY,{win:{},best:{}}),h=S.hero;st.best[h]=Math.max(st.best[h]||0,win?39:totFl());if(win)st.win[h]=(st.win[h]||0)+1;ls.set(SKEY,st)}

function rollCards(n,mode,upAll){const pool=Object.keys(C).filter(k=>C[k].r!=='b'&&(C[k].h==='all'||C[k].h===S.hero)),w=W[mode],out=[];
 for(let i=0;i<n;i++){const q=Math.random(),rar=q<w.c?'c':q<w.c+w.u?'u':'r';let cand=pool.filter(k=>C[k].r===rar&&!out.includes(k));if(!cand.length)cand=pool.filter(k=>!out.includes(k));out.push(pick(cand))}
 return out.map(k=>card(k,upAll||Math.random()<.1))}

const alive=()=>B.en.filter(e=>e.hp>0);
function tg(){let t=B.en[B.tgt];if(!t||t.hp<=0){t=alive()[0];if(t)B.tgt=B.en.indexOf(t)}return t}
const rage=p=>B&&p===B.p&&S.hero==='berserker'&&p.hp<=p.max/2?3:0;
function calc(src,dst,v){v+=(src.st.str||0)+rage(src);if(src.st.weak)v=Math.floor(v*.75);if(dst.st.vul)v=Math.floor(v*1.5);return Math.max(0,v)}
function dmg(dst,v){const b=Math.min(dst.block,v);dst.block-=b;v-=b;dst.hp=Math.max(0,dst.hp-v);const me=dst===B.p;
 FX.push({id:dst.id,t:v?'-'+v:'막음',c:v?'r':'b',v,k:me?(B.ek?'claw':null):(B.vk||null),col:B.vc});
 if(me){if(v)sfx('hurt');else sfx('block')}else{sfx('hit');if(dst.hp<=0){FX.push({id:dst.id,k:'die'});if(has('soul')&&B.p.hp>0){B.p.hp=Math.min(B.p.max,B.p.hp+2);fx('pl','+2','g')}}}
 if(dst.k==='dragon'&&!dst.enr&&dst.hp>0&&dst.hp<dst.max/2){dst.enr=1;st(dst,'str',3);banner('용이 격노했다!');sfx('roar');FX.push({id:dst.id,k:'boom',col:'#ff3a2a'})}}
const pb=()=>(B.bon||0)+(META.up.dmg||0);
function hit(v,n=1){for(let k=0;k<n;k++){const t=tg();if(!t)return;dmg(t,calc(B.p,t,v+pb()))}}
function hitAll(v){alive().forEach(e=>dmg(e,calc(B.p,e,v+pb())))}
function blk(v){B.p.block+=v;fx('pl','+'+v+' 방어','b');fxk('pl','shield')}
function heal(v){B.p.hp=Math.min(B.p.max,B.p.hp+v);fx('pl','+'+v,'g');fxk('pl','heal');sfx('heal')}
function selfHurt(n){B.p.hp=Math.max(1,B.p.hp-n);fx('pl','-'+n,'r');sfx('hurt')}
function addMana(v){B.mana=Math.min(B.maxM,B.mana+v)}
function st(ent,k,n){if(n>0)ent.st[k]=(ent.st[k]||0)+n}
function pst(ent,k,n){n+=(S.hero==='rogue'&&k==='bleed'?1:0)+(has('fang')?1:0)+(k==='bleed'?(B.p.st.venom||0):0);st(ent,k,n)}
function decay(ent){['vul','weak'].forEach(k=>{if(ent.st[k])ent.st[k]--})}
function dot(ent){[['bleed','출혈'],['burn','화상']].forEach(([k,n])=>{const v=ent.st[k];if(v>0){ent.hp=Math.max(0,ent.hp-v);ent.st[k]--;fx(ent.id,`-${v} ${n}`,'r');if(ent!==B.p&&ent.hp<=0)fxk(ent.id,'die')}})}
function draw(n){for(let i=0;i<n;i++){if(B.hand.length>=10)return;if(!B.draw.length){if(!B.disc.length)return;B.draw=shuf(B.disc);B.disc=[]}B.hand.push(B.draw.pop())}}
function dead(){if(B.p.hp>0)return false;if(has('phoenix')&&!S.phx){S.phx=1;B.p.hp=Math.ceil(B.p.max*.3);fx('pl','부활!','g');fxk('pl','heal');sfx('relic');banner('불사조 깃털이 타올랐다!');return false}return true}
function enc(type){const f=S.floor,P=ENC[S.act];if(type==='boss')return[ABOSS[S.act]];

 else if(m==='help'){title='도움말';body=`<div class="gl"><p><b>행동력</b> 카드 왼쪽 위 숫자만큼 써요. 매 턴 다시 차요.</p><p><b>마나</b> 카드 오른쪽 위 마름모만큼 써요. 용사마다 회복량이 달라요.</p><p><b>적 머리 위 표시</b> 다음 행동이에요. 칼은 공격(숫자 × 횟수), 방패는 방어도.</p><p><b>방어도</b> 받는 피해를 먼저 막아요. 내 턴이 시작되면 사라져요.</p><p><b>취약</b> 받는 피해 50% 증가. <b>약화</b> 주는 피해 25% 감소.</p><p><b>출혈·화상</b> 턴 시작마다 수치만큼 피해를 입고 1 줄어요.</p><p><b>힘</b> 공격 피해가 수치만큼 늘어요. <b>가시</b> 공격받을 때마다 수치만큼 되돌려줘요.</p><p><b>소멸</b> 쓰면 이번 전투 동안 덱에서 빠져요.</p><p>적을 눌러 공격 대상을 바꿀 수 있어요.</p></div>`}
 else if(m==='daily'){const{s,amt}=dailyAmt(),done=META.daily===today();title='출석 보상';body=`<div class="panel center"><svg viewBox="0 0 24 24" width="80" height="80">${ICO.shard.replace(/<\/?svg[^>]*>/g,'')}</svg><h2>${done?'오늘은 이미 받았어요':`${s}일 연속 출석!`}</h2><p class="soft">매일 들르면 보상이 커져요 (7일째 최대).</p>${done?`<p>내일 또 만나요. 현재 ${META.streak}일 연속.</p>`:`<button class="btn big" data-a="claimd">별조각 ${amt}개 받기</button>`}</div>`}
 else if(m==='opts'){title='설정';body=`<div class="tog"><span>배경음악</span><button class="btn ${OPT.music?'':'alt'}" data-a="tmusic">${OPT.music?'켜짐':'꺼짐'}</button></div><div class="tog"><span>효과음</span><button class="btn ${OPT.sfx?'':'alt'}" data-a="tsfx">${OPT.sfx?'켜짐':'꺼짐'}</button></div>${S&&!S.done?`<div class="tog"><span>이번 원정 포기 (별조각은 받아요)</span><button class="btn alt" data-a="abandon">${MOD.sure?'정말 포기':'포기하기'}</button></div>`:''}`}
 return `<div class="modal"><div class="in"><div class="mh"><h2 style="font-size:24px">${title}</h2><button class="btn alt" data-a="mclose">닫기</button></div>${body}</div></div>`}
let dailyShown=false;
function render(){const scr=S?S.scr:M;if(!S&&M==='title'&&!dailyShown&&!MOD&&META.daily!==today()){dailyShown=true;MOD={m:'daily'}}
 $('#app').innerHTML=(S?V[scr]():V[M]())+modalH();
 if(scr==='map'&&!MOD){const g=$('#go');if(g)g.scrollIntoView({block:'center'})}
 music(scr==='battle'?(B&&B.type==='boss'?'boss':'battle'):(scr==='win'||scr==='lose')?null:'menu');flushFx()}

/* ================= 입력 ================= */
let startSure=0;
const A={
start(){if(load()&&!startSure&&!(S&&S.done)){startSure=1;sfx('err');return toast('진행 중인 원정이 있어요. 한 번 더 누르면 새로 시작해요',2400)}startSure=0;sfx('click');B=null;MOD=null;newRun(META.sel)},
cont(){S=load();if(S){S.scr=S.scr==='battle'?'map':S.scr;MOD=null}render()},
title(){S=null;B=null;M='title';MOD=null;render()},
heroes(){M='heroes';render()},growth(){M='growth';render()},quests(){M='quests';render()},
daily(){MOD={m:'daily'};render()},
claimd(){if(META.daily===today())return;const{s,amt}=dailyAmt();META.daily=today();META.streak=s;META.shards+=amt;saveMeta();sfx('relic');toast(`별조각 +${amt}`);MOD=null;render()},
sel(i){if(!META.unlocked.includes(HK[i]))return;META.sel=HK[i];saveMeta();sfx('click');render()},
unlock(i){const k=HK[i],c=H[k].lock;if(META.unlocked.includes(k)||META.shards<c)return;META.shards-=c;META.unlocked.push(k);META.sel=k;saveMeta();sfx('relic');banner(`${H[k].n} 합류!`);render()},
skin(i){const k=HK[Math.floor(i/10)],[id,n,p]=H[k].skins[i%10],key=k+':'+id;if(!META.unlocked.includes(k))return;
 if(p&&!META.owned.includes(key)){if(META.shards<p){sfx('err');return toast('별조각이 부족해요')}META.shards-=p;META.owned.push(key);sfx('relic');banner(`${n} 획득!`)}else sfx('click');
 META.skin[k]=id;saveMeta();render()},
grow(i){const g=GROW[i],l=META.up[g.k]||0;if(l>=g.max)return;const c=g.cost[l];if(META.shards<c)return;META.shards-=c;META.up[g.k]=l+1;saveMeta();sfx('relic');render()},
claim(i){const a=ACH[i];if(META.claimed.includes(a.id)||(META.cnt[a.k]||0)<a.g)return;META.claimed.push(a.id);META.shards+=a.r;saveMeta();sfx('relic');toast(`별조각 +${a.r}`);render()},
quit(){save();S=null;M='title';render()},
node(i){if(S.floor>=S.map.length||!canGo(i))return;sfx('click');S.pos=i;S.path[S.floor]=i;const t=S.map[S.floor][i].t;
 if(t==='battle'||t==='elite'||t==='boss')return startBattle(t);
 if(t==='rest')S.scr='rest';
 else if(t==='shop'){const rk=rollRelic();S.shop={items:rollCards(5,'shop').map(c=>({c,p:price(c),sold:0})),rel:rk?{k:rk,p:R(140,170),sold:0}:null,rm:0,heal:0};S.scr='shop'}
 else if(t==='event'){let opts=EV.map((_,k)=>k).filter(k=>!S.seen.includes(k));if(!opts.length)opts=EV.map((_,k)=>k);const k=pick(opts);S.seen.push(k);S.ev={i:k,res:null};S.scr='event'}
 else{let g=R(40,70);if(has('lucky'))g=Math.round(g*1.5);S.gold+=g;const rel=rollRelic();if(rel)gainRelic(rel);S.rw={gold:g,relic:rel,cards:rel?[]:rollCards(2,'rare',true)};S.scr='treasure';sfx('coin')}
 save();render()},
play,
tgt(i){if(busy||!B.en[i]||B.en[i].hp<=0)return;B.tgt=i;sfx('click');render()},
end(){sfx('click');endTurn()},
pickc(i){S.deck.push(S.rw.cards[i]);sfx('card');proceed()},
next(){sfx('click');proceed()},
buy(i){const it=S.shop.items[i];if(it.sold)return;if(S.gold<it.p){sfx('err');return toast('금화가 부족해요')}S.gold-=it.p;it.sold=1;S.deck.push(it.c);sfx('coin');save();render()},
buyrel(){const r=S.shop.rel;if(!r||r.sold||S.gold<r.p)return;S.gold-=r.p;r.sold=1;gainRelic(r.k);save();render()},
srm(){MOD={m:'remove',ctx:'shop'};render()},
sheal(){S.gold-=40;S.hp=Math.min(S.max,S.hp+20);S.shop.heal=1;sfx('heal');save();render()},
rheal(){S.hp=Math.min(S.max,S.hp+Math.ceil(S.max*.3));sfx('heal');proceed()},
rup(){MOD={m:'upgrade',ctx:'rest'};render()},
evo(i){const o=EV[S.ev.i].o[i];if(o.need&&!o.need())return;const r=o.f();if(r)S.ev.res=r;save();render()},
deck(){MOD={m:'view'};render()},
pdraw(){MOD={m:'pile'};render()},
help(){MOD={m:'help'};render()},
opts(){MOD={m:'opts'};render()},
tmusic(){setOpt('music');render()},
tsfx(){setOpt('sfx');render()},
abandon(){if(!MOD.sure){MOD.sure=1;return render()}MOD=null;B=null;busy=false;S.ab=1;endRun(false);S.scr='lose';render()},
mclose(){if(MOD&&MOD.ctx==='event'&&!S.ev.res)S.ev.res='마음을 바꿨다.';MOD=null;render()},
mpick(i){const m=MOD.m,ctx=MOD.ctx;
 if(m==='remove'){const c=S.deck.splice(i,1)[0];if(ctx==='shop'){S.gold-=60;S.shop.rm=1}else S.ev.res=`「${C[c.id].n}」 카드를 덱에서 지웠다.`}
 else if(m==='upgrade'){S.deck[i].up=true;cntAdd('ups',1);saveMeta();sfx('relic');if(ctx==='rest'){MOD=null;return proceed()}S.ev.res=`「${C[S.deck[i].id].n}」 카드가 강해졌다!`}
 MOD=null;save();render()},
relinfo(i){const k=S.relics[i];if(k)toast(`${RL[k].n} — ${RL[k].d}`,2600)},
none(){}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=A[t.dataset.a];if(f)f(+t.dataset.i)});
document.addEventListener('keydown',e=>{if(S&&S.scr==='battle'&&!MOD){if(e.key==='e'||e.key==='E')endTurn();const n=+e.key;if(n>=1&&n<=9)play(n-1)}});
render();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
</script></body></html>
