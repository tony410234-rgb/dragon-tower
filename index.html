<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2a1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>용의 탑</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 동화책 같은 판타지 모험, 한 판 10~20분
   IDEA: 횃불 켜진 탑을 한 층씩 오르는 원정 일지와 카드 테이블
   PICTURE: 돌바닥 위에서 마주 선 용사와 괴물들
   COLOUR+TYPE: 깊은 와인빛 돌벽, 양피지 카드, 청록 마나, 붉은 체력 / Black Han Sans + Noto Sans KR
   LAYOUT: 상단 상태바, 가운데 전장, 하단 손패 — 폰 세로 화면 전용 */
:root{color-scheme:dark;--wall:#4a2230;--deep:#1c0d15;--parch:#f5ecd9;--ink:#24151b;--hp:#e5452f;--gold:#f0c04a;--mana:#3fd1c4;--atk:#c93a2a;--mag:#2a8fd8;--def:#5b7a8c;--skl:#3f9a5a}
*{box-sizing:border-box;min-width:0}
html,body{min-height:100%;overscroll-behavior:none}
body{margin:0;background:radial-gradient(130% 70% at 50% 0,#6a2f40,var(--wall) 45%,var(--deep));background-attachment:fixed;color:var(--parch);font:15px/1.45 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2{font-family:"Black Han Sans",sans-serif;font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(40px,12vw,60px)}h2{font-size:30px}
p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;min-height:44px;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{background:var(--hp);color:#fff;border-radius:12px;padding:10px 20px;font-weight:900;box-shadow:0 4px 0 #8f2416}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f2416}
.btn.alt{background:var(--parch);color:var(--ink);box-shadow:0 4px 0 #b4a688}
.btn[disabled]{opacity:.4;pointer-events:none}
.bar{display:flex;align-items:center;gap:10px 14px;padding:10px 14px;background:rgba(20,8,13,.65);font-weight:700;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.hp{flex:1 1 150px;height:18px;background:#3d1512;border-radius:9px;overflow:hidden;position:relative}
.hp i{display:block;height:100%;background:linear-gradient(#ff7c62,#c93a2a);transition:width .3s}
.hp span{position:absolute;inset:0;text-align:center;font-size:13px;line-height:18px;text-shadow:0 1px 2px #000}
.gold{color:var(--gold)}.chip{white-space:nowrap}
.bar .btn{min-height:36px;padding:4px 12px;font-size:14px}
.wrap{padding:20px max(4vw,14px);display:flex;flex-direction:column;gap:16px;flex:1}
.hero{position:relative;aspect-ratio:16/11;max-height:46vh;width:100%;border-radius:18px;overflow:hidden}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.rules{display:grid;gap:8px;background:rgba(20,8,13,.5);border-radius:14px;padding:14px 16px}
.rules b{color:var(--gold)}
.row-btns{display:flex;gap:12px;flex-wrap:wrap}
.chart{position:relative;display:flex;flex-direction:column;gap:10px;padding:8px 0 24px}
.chart::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed rgba(245,236,217,.2)}
.mrow{position:relative;display:flex;justify-content:center;gap:clamp(10px,5vw,34px);padding:6px;border-radius:16px}
.mrow.cur{background:rgba(240,192,74,.14);box-shadow:inset 0 0 0 2px rgba(240,192,74,.6)}
.mrow.past{opacity:.38}
.rn{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:13px;color:#e8c9b0}
.node{width:66px;min-height:66px;border-radius:50%;background:var(--parch);color:var(--ink);display:grid;place-items:center;align-content:center;box-shadow:0 4px 0 rgba(0,0,0,.4);position:relative}
.node svg{width:28px;height:28px}.node small{font-size:13px;font-weight:900;line-height:1}
.node[disabled]{cursor:default}
.mrow.cur .node{animation:bob 1.6s ease-in-out infinite}
.node.went{box-shadow:0 0 0 4px var(--gold),0 4px 0 rgba(0,0,0,.4)}
.n-elite{background:#ffd3c9}.n-boss{background:var(--hp);color:#fff;width:84px;min-height:84px}
.n-rest{background:#dcf0df}.n-shop{background:#ffefc4}.n-treasure{background:#d3f3ef}
@keyframes bob{50%{transform:translateY(-4px)}}
.field{position:relative;display:grid;grid-template-columns:minmax(0,32%) minmax(0,1fr);align-items:end;gap:8px;padding:14px 10px 18px;min-height:clamp(250px,42vh,360px);background:linear-gradient(transparent 63%,#5b4a48 63%,#3e3133);overflow:hidden}
.field::before{content:"";position:absolute;inset:auto 0 0 0;height:37%;background:repeating-linear-gradient(90deg,transparent 0 70px,rgba(0,0,0,.28) 70px 73px),repeating-linear-gradient(0deg,transparent 0 30px,rgba(0,0,0,.2) 30px 32px);pointer-events:none}
.field::after{content:"";position:absolute;top:18px;left:50%;width:14px;height:30px;border-radius:50% 50% 40% 40%;background:radial-gradient(#fff3b0,#ff9a2e 60%,transparent 70%);filter:blur(1px);box-shadow:0 0 60px 30px rgba(255,150,50,.18);animation:flick 1.2s infinite alternate}
@keyframes flick{to{transform:scale(1.08,.94)}}
.ent{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:1}
.spr{width:100%;max-width:130px;aspect-ratio:1}.spr svg{width:100%;height:100%;display:block}
.foes{display:flex;justify-content:space-around;align-items:flex-end;gap:4px;flex-wrap:wrap}
.foe{flex:1 1 0;max-width:150px;border-radius:14px;padding:4px 3px;border:2px solid transparent}
.foe.sel{border-color:var(--gold);background:rgba(240,192,74,.12)}
.foe.boss{max-width:200px}.foe.boss .spr{max-width:190px}
.nm{font-size:13px;font-weight:700;text-align:center;line-height:1.2;text-shadow:0 1px 2px #000}
.mini{width:100%;height:12px;background:#3d1512;border-radius:6px;position:relative;overflow:hidden}
.mini i{display:block;height:100%;background:#e0482e;transition:width .3s}
.mini span{position:absolute;inset:0;font-size:11px;line-height:12px;text-align:center;font-weight:700;text-shadow:0 1px 1px #000}
.sts{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:20px}
.st{font-size:12px;font-weight:700;padding:1px 6px;border-radius:8px;background:rgba(0,0,0,.5);white-space:nowrap}
.st.blk{background:#4f7c99}.st.vul{background:#8e3fb0}.st.weak{background:#6b6b6b}.st.bleed{background:#a3161e}.st.str{background:#b5651d}
.int{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:26px}
.int em{font-style:normal;font-weight:900;font-size:13px;display:inline-flex;align-items:center;gap:2px;background:var(--parch);color:var(--ink);padding:2px 7px;border-radius:10px;white-space:nowrap}
.int em svg{width:14px;height:14px}.int .ia{background:#ffd2c7;color:#8f1f0c}.int .ib{background:#d3e4ee;color:#1d3f55}
.res{display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(20,8,13,.6);flex-wrap:wrap}
.orb{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold) 55%,#9a6b00);color:#3a2500;display:grid;place-items:center;font:22px "Black Han Sans",sans-serif;box-shadow:0 3px 0 rgba(0,0,0,.4);flex:none}
.mana{display:flex;gap:5px;align-items:center}
.gem{width:16px;height:22px;clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);background:#1d4d49}
.gem.on{background:linear-gradient(#bff7f1,var(--mana) 60%,#178b80)}
.pile{font-size:13px;color:#e8c9b0;line-height:1.3}
.res .btn{margin-left:auto}
.hand{display:flex;gap:8px;overflow-x:auto;padding:14px 12px 22px;scroll-snap-type:x proximity;justify-content:safe center}
.card{--c:var(--skl);flex:none;width:112px;height:158px;border-radius:12px;background:var(--parch);color:var(--ink);position:relative;padding:30px 7px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.4);border-top:22px solid var(--c);scroll-snap-align:center;transition:transform .12s}
.card:active{transform:translateY(-6px)}
.card.t-atk{--c:var(--atk)}.card.t-mag{--c:var(--mag)}.card.t-def{--c:var(--def)}
.card.no{opacity:.45}
.card.up .cn{color:#2c7a43}
.cost{position:absolute;top:-30px;left:-8px;width:32px;height:32px;border-radius:50%;background:var(--gold);color:#3a2500;display:grid;place-items:center;font:18px "Black Han Sans",sans-serif;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.am{position:absolute;top:-17px;right:8px;display:flex;gap:3px}
.am u{width:10px;height:14px;clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);background:#bff7f1}
.cn{font-weight:900;font-size:14px;line-height:1.15}
.ct{font-size:12px;font-weight:700;color:var(--c)}
.cd{font-size:13px;line-height:1.3;margin-block:auto}
.grid{display:flex;flex-wrap:wrap;gap:22px 12px;justify-content:center;padding-top:14px}
.price{display:block;text-align:center;font-weight:900;color:var(--gold);margin-top:8px}
.sold{opacity:.25;pointer-events:none}
.panel{background:rgba(20,8,13,.55);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.center{text-align:center;align-items:center}
.modal{position:fixed;inset:0;background:rgba(20,8,13,.94);z-index:20;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 40px}
.modal .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.mh{display:flex;align-items:center;gap:12px;justify-content:space-between;position:sticky;top:0;background:rgba(20,8,13,.96);padding:6px 0;z-index:2}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.fl{position:fixed;transform:translate(-50%,0);font:28px "Black Han Sans",sans-serif;text-shadow:0 2px 0 #000,0 0 8px #000;animation:up .9s ease-out forwards}
.fl.r{color:#ff6b4f}.fl.b{color:#9cc9e6}.fl.g{color:#7fe0a0}
@keyframes up{to{transform:translate(-50%,-56px);opacity:0}}
.shk{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-7px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
#toast{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);background:var(--parch);color:var(--ink);font-weight:900;padding:8px 16px;border-radius:20px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
@media(max-width:420px){.card{width:100px;height:150px;padding-inline:5px}.hand{justify-content:flex-start}}
@media(prefers-reduced-motion:reduce){.shk,.fl,.mrow.cur .node,.field::after{animation:none}.card{transition:none}}
</style></head><body>
<div id="app"></div><div id="fx"></div><div id="toast"></div>
<script>
{
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const KEY='dragon-tower-run-v1';
let S=null,B=null,busy=false,FX=[];
const TL={atk:'근접',mag:'마법',def:'방어',skl:'기술'};
const NL={battle:'전투',elite:'정예',rest:'휴식',shop:'상점',treasure:'보물',boss:'보스'};

/* ---------- 카드 ---------- */
const C={
slash:{n:'베기',t:'atk',e:1,v:[6,9],d:v=>`피해 ${v}`,f:v=>hit(v)},
fire:{n:'화염구',t:'mag',e:1,a:1,v:[10,14],d:v=>`피해 ${v}`,f:v=>hit(v)},
guard:{n:'방패 들기',t:'def',e:1,v:[5,8],d:v=>`방어도 ${v}`,f:v=>blk(v)},
med:{n:'명상',t:'skl',e:0,v:[2,3],d:v=>`마나 +${v}`,f:v=>addMana(v)},
chain:{n:'연쇄 번개',t:'mag',e:1,a:1,v:[7,10],d:v=>`적 전체에게 피해 ${v}`,f:v=>hitAll(v)},
meteor:{n:'운석 낙하',t:'mag',e:2,a:1,v:[22,30],d:v=>`피해 ${v}`,f:v=>hit(v)},
arrow:{n:'마법 화살',t:'mag',e:1,a:2,v:[8,11],d:v=>`피해 ${v} × 2`,f:v=>hit(v,2)},
whirl:{n:'회전 베기',t:'atk',e:1,v:[4,5],d:v=>`피해 ${v} × 3`,f:v=>hit(v,3)},
thorn:{n:'가시 단검',t:'atk',e:1,v:[7,9],d:v=>`피해 ${v}, 출혈 ${v>7?4:3}`,f:v=>{hit(v);const t=tg();if(t)st(t,'bleed',v>7?4:3)}},
bomb:{n:'폭발 물약',t:'skl',e:1,x:1,v:[11,15],d:v=>`적 전체에게 피해 ${v}. 소멸`,f:v=>hitAll(v)},
potion:{n:'회복 물약',t:'skl',e:0,x:1,v:[5,8],d:v=>`체력 ${v} 회복. 소멸`,f:v=>heal(v)},
wind:{n:'바람 걸음',t:'def',e:1,v:[8,11],d:v=>`방어도 ${v}, 카드 1장 뽑기`,f:v=>{blk(v);draw(1)}},
dodge:{n:'재빠른 막기',t:'def',e:0,v:[4,7],d:v=>`방어도 ${v}`,f:v=>blk(v)},
curse:{n:'저주',t:'skl',e:1,v:[2,3],d:v=>`취약 ${v}, 약화 ${v-1}`,f:v=>{const t=tg();if(t){st(t,'vul',v);st(t,'weak',v-1)}}},
rage:{n:'광전사의 함성',t:'skl',e:1,x:1,v:[2,3],d:v=>`힘 +${v} (전투 동안). 소멸`,f:v=>st(B.p,'str',v)},
well:{n:'마나의 샘',t:'skl',e:1,v:[1,2],d:v=>`마나 가득, 카드 ${v}장 뽑기`,f:v=>{B.mana=B.maxM;draw(v)}},
insp:{n:'영감',t:'skl',e:0,v:[2,3],d:v=>`카드 ${v}장 뽑기`,f:v=>draw(v)},
finish:{n:'마무리 일격',t:'atk',e:2,v:[12,16],d:v=>`피해 ${v}. 대상이 출혈 중이면 2배`,f:v=>{const t=tg();hit(t&&t.st.bleed>0?v*2:v)}},
frost:{n:'서리 장벽',t:'def',e:2,v:[13,18],d:v=>`방어도 ${v}, 적 전체 약화 1`,f:v=>{blk(v);alive().forEach(e=>st(e,'weak',1))}},
pouch:{n:'황금 주머니',t:'skl',e:0,x:1,v:[12,20],d:v=>`금화 ${v}, 카드 1장 뽑기. 소멸`,f:v=>{S.gold+=v;draw(1)}},
holy:{n:'성검 돌격',t:'mag',e:2,a:1,v:[15,20],d:v=>`피해 ${v}, 방어도 ${v>15?9:7}`,f:v=>{hit(v);blk(v>15?9:7)}},
ward:{n:'마력 방벽',t:'def',e:1,v:[6,9],d:v=>`방어도 ${v}, 마나 +1`,f:v=>{blk(v);addMana(1)}},
};
const START=['slash','fire','guard','med'];
const POOL=Object.keys(C).filter(k=>!START.includes(k));

/* ---------- 적 ---------- */
const E={
slime:{n:'끈적 슬라임',hp:[15,19],ai:[{d:5},{d:3,c:2},{d:4,bleed:2}]},
bat:{n:'흡혈 박쥐',hp:[12,15],ai:[{d:4,vul:1},{d:6},{weak:1,b:4}]},
goblin:{n:'고블린 도적',hp:[24,28],ai:[{d:8},{d:5,b:6},{d:6,weak:1}]},
wolf:{n:'그림자 늑대',hp:[28,32],ai:[{d:11},{d:6,bleed:3},{b:8,s:2}]},
ogre:{n:'동굴 오우거',hp:[54,58],ai:[{b:12,s:2},{d:14},{d:7,c:2,vul:1}]},
dk:{n:'암흑 기사',hp:[46,50],ai:[{d:4,c:3},{d:11,weak:1},{b:10,s:2}]},
dragon:{n:'고대의 붉은 용',hp:[150,150],seq:1,ai:[{b:14,s:3},{d:6,c:3},{d:8,vul:2,weak:2},{d:20}]}
};

/* ---------- 그림 ---------- */
const sh='<ellipse cx="50" cy="94" rx="30" ry="5" fill="#000" opacity=".35"/>';
const SP={
pl:`<svg viewBox="0 0 100 100">${sh}<path d="M30 52Q22 76 26 92h48q4-16-4-40z" fill="#2f5fb5"/><rect x="38" y="82" width="9" height="12" rx="2" fill="#3a3f47"/><rect x="53" y="82" width="9" height="12" rx="2" fill="#3a3f47"/><rect x="34" y="50" width="32" height="36" rx="9" fill="#c9d2d8"/><path d="M34 62h32" stroke="#8d9aa3" stroke-width="3"/><rect x="34" y="70" width="32" height="5" fill="#5a3a26"/><rect x="47" y="69" width="7" height="7" rx="1" fill="#f0c04a"/><path d="M70 66 90 30" stroke="#e9eef1" stroke-width="5" stroke-linecap="round"/><path d="M64 66h12" stroke="#f0c04a" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="37" r="13" fill="#f0c19c"/><path d="M36 36q0-18 14-18t14 18q-4-8-14-8t-14 8z" fill="#7a4a24"/><circle cx="45" cy="38" r="2" fill="#24151b"/><circle cx="55" cy="38" r="2" fill="#24151b"/><path d="M46 45q4 3 8 0" stroke="#a0502e" stroke-width="1.8" fill="none"/><path d="M34 26q16-16 32 0" stroke="#c9d2d8" stroke-width="5" fill="none"/><path d="M50 12q8-4 12 2-6-1-10 6z" fill="#e5452f"/></svg>`,

/* ---------- 원정 ---------- */
function genMap(){const m=[['battle','battle']];for(let r=1;r<=10;r++){const n=R(2,3),row=[];for(let i=0;i<n;i++){const x=Math.random();row.push(x<.5?'battle':x<.64?(r>=3?'elite':'battle'):x<.79?'rest':x<.9?'shop':'treasure')}if(r===5)row[0]='treasure';if(r===8&&!row.includes('elite'))row[R(0,n-1)]='elite';m.push(row)}m.push(['rest','shop'],['boss']);return m}
const card=(id,up=false)=>({id,up});
function newRun(){S={hp:70,max:70,gold:99,floor:0,path:[],map:genMap(),scr:'map',modal:null,deck:[...Array(4)].map(()=>card('slash')).concat([card('fire'),card('fire'),card('guard'),card('guard'),card('guard'),card('med')])};save();render()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.deck)return s}catch(e){}return null}
function clear(){try{localStorage.removeItem(KEY)}catch(e){}}
function proceed(){S.floor++;S.scr='map';S.modal=null;save();render()}

/* ---------- 전투 ---------- */
const alive=()=>B.en.filter(e=>e.hp>0);
function tg(){let t=B.en[B.tgt];if(!t||t.hp<=0){t=alive()[0];if(t)B.tgt=B.en.indexOf(t)}return t}
function calc(src,dst,v){v+=src.st.str||0;if(src.st.weak)v=Math.floor(v*.75);if(dst.st.vul)v=Math.floor(v*1.5);return Math.max(0,v)}
function dmg(dst,v){const b=Math.min(dst.block,v);dst.block-=b;v-=b;dst.hp=Math.max(0,dst.hp-v);fx(dst.id,v?'-'+v:'막음',v?'r':'b')}
function hit(v,n=1){for(let k=0;k<n;k++){const t=tg();if(!t)return;dmg(t,calc(B.p,t,v))}}
function hitAll(v){alive().forEach(e=>dmg(e,calc(B.p,e,v)))}
function blk(v){B.p.block+=v;fx('pl','+'+v+' 방어','b')}
function heal(v){B.p.hp=Math.min(B.p.max,B.p.hp+v);fx('pl','+'+v,'g')}
function addMana(v){B.mana=Math.min(B.maxM,B.mana+v)}
function st(ent,k,n){if(n>0)ent.st[k]=(ent.st[k]||0)+n}
function decay(ent){['vul','weak'].forEach(k=>{if(ent.st[k])ent.st[k]--})}
function bleed(ent){const b=ent.st.bleed;if(b>0){ent.hp=Math.max(0,ent.hp-b);ent.st.bleed--;fx(ent.id,'-'+b+' 출혈','r')}}
function draw(n){for(let i=0;i<n;i++){if(B.hand.length>=10)return;if(!B.draw.length){if(!B.disc.length)return;B.draw=shuf(B.disc);B.disc=[]}B.hand.push(B.draw.pop())}}
function enc(type){const f=S.floor;if(type==='boss')return['dragon'];if(type==='elite')return[pick(['ogre','dk'])].concat(f>6?[pick(['slime','bat'])]:[]);
 return pick(f<4?[['slime'],['bat','slime'],['goblin'],['bat','bat']]:[['goblin','bat'],['wolf'],['slime','slime','bat'],['wolf','slime'],['goblin','goblin'],['wolf','bat']])}
function mkEn(k,i){const d=E[k];let hp=R(d.hp[0],d.hp[1]);if(k!=='dragon')hp=Math.round(hp*(1+S.floor*.05));const e={id:'e'+i,k,n:d.n,hp,max:hp,block:0,st:{},li:-1,step:0};nextInt(e);return e}
function nextInt(e){const ai=E[e.k].ai;let i;if(E[e.k].seq)i=e.step++%ai.length;else do{i=R(0,ai.length-1)}while(i===e.li&&ai.length>1);e.li=i;e.int=ai[i]}
function startBattle(type){B={type,p:{id:'pl',hp:S.hp,max:S.max,block:0,st:{}},en:enc(type).map(mkEn),draw:shuf(S.deck.map(c=>({...c}))),hand:[],disc:[],exh:[],energy:3,maxE:3,mana:3,maxM:3,tgt:0};S.scr='battle';playerTurn()}
function playerTurn(){B.p.block=0;bleed(B.p);if(B.p.hp<=0)return lose();B.energy=B.maxE;draw(5);render()}
function canPlay(c){const d=C[c.id];return B.energy>=d.e&&B.mana>=(d.a||0)}
function play(i){if(busy)return;const c=B.hand[i];if(!c)return;const d=C[c.id];
 if(B.energy<d.e)return toast('행동력이 부족해요');if(B.mana<(d.a||0))return toast('마나가 부족해요 — 명상!');
 B.energy-=d.e;B.mana-=d.a||0;B.hand.splice(i,1);d.f(d.v[c.up?1:0]);(d.x?B.exh:B.disc).push(c);buzz(15);
 if(B.p.hp<=0)return lose();if(!alive().length)return win();render()}
async function endTurn(){if(busy)return;busy=true;B.disc.push(...B.hand);B.hand=[];decay(B.p);render();
 for(const e of B.en){if(e.hp<=0)continue;await sleep(420);e.block=0;bleed(e);if(e.hp<=0){render();continue}
  const it=e.int,h0=B.p.hp;if(it.b)e.block+=it.b;if(it.s)st(e,'str',it.s);if(it.vul)st(B.p,'vul',it.vul);if(it.weak)st(B.p,'weak',it.weak);
  if(it.d)for(let k=0;k<(it.c||1);k++){dmg(B.p,calc(e,B.p,it.d));if(B.p.hp<=0)break}
  if(it.bleed)st(B.p,'bleed',it.bleed);if(B.p.hp<h0)buzz(60);decay(e);nextInt(e);render();if(B.p.hp<=0){busy=false;await sleep(500);return lose()}}
 await sleep(300);busy=false;if(!alive().length)return win();playerTurn()}
function win(){S.hp=B.p.hp;const t=B.type;B=null;
 if(t==='boss'){S.scr='win';clear();return render()}
 const el=t==='elite',g=el?R(38,52):R(14,24);S.gold+=g;if(el){S.max+=6;S.hp+=6}
 S.rw={gold:g,hp:el?6:0,cards:shuf([...POOL]).slice(0,3).map(id=>card(id,Math.random()<.12)),title:el?'정예 격파!':'승리!'};S.scr='reward';save();render()}
function lose(){busy=false;S.scr='lose';clear();render()}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ---------- 화면 ---------- */
function cardH(c,i,act,ok=true){const d=C[c.id],v=d.v[c.up?1:0];return `<button class="card t-${d.t} ${ok?'':'no'} ${c.up?'up':''}" data-a="${act}" data-i="${i}"><b class="cost">${d.e}</b>${d.a?`<i class="am">${'<u></u>'.repeat(d.a)}</i>`:''}<span class="cn">${d.n}${c.up?'+':''}</span><span class="ct">${TL[d.t]}</span><span class="cd">${d.d(v)}</span></button>`}
function stH(e){const L={vul:'취약',weak:'약화',bleed:'출혈',str:'힘'};let h=e.block?`<span class="st blk">방어 ${e.block}</span>`:'';for(const k in L)if(e.st[k])h+=`<span class="st ${k}">${L[k]} ${e.st[k]}</span>`;return `<div class="sts">${h}</div>`}
function intH(e){const it=e.int,p=[];if(it.d)p.push(`<em class="ia">${ICO.sword}${calc(e,B.p,it.d)}${it.c>1?'×'+it.c:''}</em>`);if(it.b)p.push(`<em class="ib">${ICO.shield}${it.b}</em>`);if(it.s)p.push(`<em>힘+${it.s}</em>`);if(it.vul)p.push(`<em>취약${it.vul}</em>`);if(it.weak)p.push(`<em>약화${it.weak}</em>`);if(it.bleed)p.push(`<em>출혈${it.bleed}</em>`);return `<div class="int">${p.join('')}</div>`}
const mini=e=>`<div class="mini"><i style="width:${e.hp/e.max*100}%"></i><span>${e.hp}/${e.max}</span></div>`;
function topBar(){const hp=B?B.p.hp:S.hp,mx=B?B.p.max:S.max;return `<div class="bar"><div class="hp"><i style="width:${hp/mx*100}%"></i><span>체력 ${hp}/${mx}</span></div><span class="chip gold">금화 ${S.gold}</span><span class="chip">${Math.min(S.floor+1,13)}층/13</span><button class="btn alt" data-a="deck">덱 ${S.deck.length}</button></div>`}

<h1>용의 탑</h1><p style="font-size:17px;color:#e8c9b0">카드를 모아 덱을 키우며 13층 탑을 올라, 꼭대기의 고대 용을 쓰러뜨리세요.</p>

<div class="row-btns"><button class="btn" data-a="start">새 원정 시작</button>${sv?`<button class="btn alt" data-a="cont">이어하기 (${sv.floor+1}층)</button>`:''}</div></div>`},
map(){let h='';for(let r=S.map.length-1;r>=0;r--){const cur=r===S.floor,past=r<S.floor;h+=`<div class="mrow ${cur?'cur':''} ${past?'past':''}" ${cur?'id="currow"':''}><span class="rn">${r+1}층</span>${S.map[r].map((t,i)=>`<button class="node n-${t} ${S.path[r]===i?'went':''}" ${cur?`data-a="node" data-i="${i}"`:'disabled'} aria-label="${NL[t]}">${ICO[t]}<small>${NL[t]}</small></button>`).join('')}</div>`}
 return topBar()+`<div class="wrap"><h2>탑의 지도</h2><p style="color:#e8c9b0">빛나는 줄에서 다음 방을 고르세요. 위로 갈수록 용에게 가까워집니다.</p><div class="chart">${h}</div><button class="btn alt" data-a="quit">처음 화면으로 (저장됨)</button></div>`},

<div class="foes">${B.en.map((e,i)=>e.hp>0?`<button class="ent foe ${i===B.tgt?'sel':''} ${e.k==='dragon'?'boss':''}" id="${e.id}" data-a="tgt" data-i="${i}">${intH(e)}<div class="spr">${SP[e.k]}</div><div class="nm">${e.n}</div>${mini(e)}${stH(e)}</button>`:'').join('')}</div></div>
<div class="res"><div class="orb" aria-label="행동력">${B.energy}/${B.maxE}</div><div><div class="mana">${[...Array(B.maxM)].map((_,i)=>`<span class="gem ${i<B.mana?'on':''}"></span>`).join('')}</div><div class="pile">마나 ${B.mana}/${B.maxM}</div></div><div class="pile">뽑을 카드 ${B.draw.length}<br>버린 카드 ${B.disc.length}</div><button class="btn" data-a="end" ${busy?'disabled':''}>${busy?'적의 차례…':'턴 종료'}</button></div>
<div class="hand">${B.hand.map((c,i)=>cardH(c,i,'play',canPlay(c))).join('')||'<p style="color:#e8c9b0;padding:40px 0">손패가 비었어요</p>'}</div>`},
reward(){const w=S.rw;return topBar()+`<div class="wrap"><div class="panel center"><h2>${w.title}</h2><p class="gold" style="font-weight:900">금화 +${w.gold}${w.hp?` · 최대 체력 +${w.hp}`:''}</p></div><div class="panel"><p style="font-weight:700">덱에 넣을 카드 1장을 고르세요</p><div class="grid">${w.cards.map((c,i)=>cardH(c,i,'pickc')).join('')}</div></div><button class="btn alt" data-a="next">카드 없이 계속</button></div>`},
treasure(){const w=S.rw;return topBar()+`<div class="wrap"><div class="panel center"><h2>먼지 쌓인 보물상자</h2><p class="gold" style="font-weight:900">금화 +${w.gold}</p><p>안에 강화된 카드가 들어 있어요. 하나를 가져가세요.</p></div><div class="grid">${w.cards.map((c,i)=>cardH(c,i,'pickc')).join('')}</div><button class="btn alt" data-a="next">그냥 떠나기</button></div>`},
shop(){const s=S.shop;return topBar()+`<div class="wrap"><h2>떠돌이 상인</h2><div class="grid">${s.items.map((it,i)=>`<div class="${it.sold?'sold':''}">${cardH(it.c,i,'buy',S.gold>=it.p)}<span class="price">${it.p} 금화</span></div>`).join('')}</div>
<div class="panel"><div class="row-btns"><button class="btn alt" data-a="srm" ${s.rm||S.gold<60||S.deck.length<6?'disabled':''}>카드 1장 버리기 · 60</button><button class="btn alt" data-a="sheal" ${s.heal||S.gold<40?'disabled':''}>체력 20 회복 · 40</button></div></div><button class="btn" data-a="next">다음 층으로</button></div>`},
rest(){return topBar()+`<div class="wrap"><div class="panel center"><svg viewBox="0 0 24 24" width="90" height="90">${ICO.rest.replace(/<\/?svg[^>]*>/g,'')}</svg><h2>계단참의 모닥불</h2><p>잠시 쉬어 가거나, 장비를 손질하세요.</p></div><div class="row-btns"><button class="btn" data-a="rheal">휴식 · 체력 ${Math.ceil(S.max*.3)} 회복</button><button class="btn alt" data-a="rup">카드 1장 강화</button></div></div>`},
win(){return `<div class="wrap" style="justify-content:center;text-align:center;align-items:center"><div class="spr" style="max-width:200px">${SP.pl}</div><h1>용을 쓰러뜨렸다!</h1><p>탑 꼭대기에 깃발을 꽂았어요. 덱 ${S.deck.length}장, 남은 체력 ${S.hp}.</p><button class="btn" data-a="title">처음으로</button></div>`},
lose(){return `<div class="wrap" style="justify-content:center;text-align:center;align-items:center"><div class="spr" style="max-width:180px;filter:grayscale(1)">${SP.pl}</div><h1>원정 실패…</h1><p>${S.floor+1}층에서 쓰러졌어요. 다시 도전해 보세요!</p><button class="btn" data-a="start">새 원정 시작</button><button class="btn alt" data-a="title">처음으로</button></div>`}
};
function modalH(){const m=S.modal;if(!m)return'';const T={view:'내 덱',remove:'버릴 카드를 고르세요 (60 금화)',upgrade:'강화할 카드를 고르세요'};
 const list=S.deck.map((c,i)=>[c,i]).sort((a,b)=>a[0].id.localeCompare(b[0].id));
 return `<div class="modal"><div class="in"><div class="mh"><h2 style="font-size:24px">${T[m]}</h2><button class="btn alt" data-a="mclose">닫기</button></div><div class="grid">${list.map(([c,i])=>m==='upgrade'&&c.up?'':cardH(m==='upgrade'?{...c,up:true}:c,i,m==='view'?'none':'mpick')).join('')}</div>${m==='upgrade'?'<p style="text-align:center;color:#e8c9b0">강화 후 모습으로 표시됩니다</p>':''}</div></div>`}
function render(){$('#app').innerHTML=(S?V[S.scr]():V.title())+(S?modalH():'');if(S&&S.scr==='map'){const c=$('#currow');if(c)c.scrollIntoView({block:'center'})}flushFx()}
function fx(id,t,c){FX.push([id,t,c])}
function flushFx(){const L=$('#fx');FX.forEach(([id,t,c])=>{const el=document.getElementById(id);if(!el)return;const r=el.getBoundingClientRect(),d=document.createElement('div');d.className='fl '+c;d.textContent=t;d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+r.height*.35)+'px';L.appendChild(d);setTimeout(()=>d.remove(),950);if(c==='r'){const s=el.querySelector('.spr');if(s){s.classList.remove('shk');void s.offsetWidth;s.classList.add('shk')}}});FX=[]}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1400)}

/* ---------- 입력 ---------- */
const A={
start:newRun,
cont(){S=load();if(S){S.scr='map';S.modal=null}render()},
title(){S=null;B=null;render()},
quit(){save();S=null;render()},
node(i){if(S.path[S.floor]!==undefined)return;S.path[S.floor]=i;const t=S.map[S.floor][i];
 if(t==='battle'||t==='elite'||t==='boss')startBattle(t);
 else if(t==='rest'){S.scr='rest';render()}
 else if(t==='shop'){S.shop={items:shuf([...POOL]).slice(0,5).map(id=>{const up=Math.random()<.2;return{c:card(id,up),p:R(42,70)+(up?25:0),sold:0}}),rm:0,heal:0};S.scr='shop';render()}
 else{const g=R(40,70);S.gold+=g;S.rw={gold:g,cards:shuf([...POOL]).slice(0,2).map(id=>card(id,true))};S.scr='treasure';render()}},
play,
tgt(i){if(busy)return;B.tgt=i;render()},
end:endTurn,
pickc(i){S.deck.push(S.rw.cards[i]);proceed()},
next:proceed,
buy(i){const it=S.shop.items[i];if(it.sold)return;if(S.gold<it.p)return toast('금화가 부족해요');S.gold-=it.p;it.sold=1;S.deck.push(it.c);render()},
srm(){S.modal='remove';render()},
sheal(){S.gold-=40;S.hp=Math.min(S.max,S.hp+20);S.shop.heal=1;render()},
rheal(){S.hp=Math.min(S.max,S.hp+Math.ceil(S.max*.3));proceed()},
rup(){if(S.deck.every(c=>c.up))return toast('강화할 카드가 없어요');S.modal='upgrade';render()},
deck(){S.modal='view';render()},
mclose(){S.modal=null;render()},
mpick(i){if(S.modal==='remove'){S.deck.splice(i,1);S.gold-=60;S.shop.rm=1;S.modal=null;render()}else if(S.modal==='upgrade'){S.deck[i].up=true;proceed()}},
none(){}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=A[t.dataset.a];if(f)f(+t.dataset.i)});
document.addEventListener('keydown',e=>{if(S&&S.scr==='battle'&&!S.modal){if(e.key==='e'||e.key==='E')endTurn();const n=+e.key;if(n>=1&&n<=9)play(n-1)}});
render();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
</script></body></html>
